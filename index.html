};

// 灯光系统
const LightingSystem = {
    update(deltaTime, time) {
        // 灯光动画
        emissives.forEach(obj => {
            if(obj.userData.type === 'led_instanced') {
                const data = obj.userData.data;
                for(let i=0; i<obj.count; i++) {
                    const item = data[i];
                    const val = Math.sin(time * item.speed + item.offset);
                    const intensity = 0.5 + 1.25 * (val + 1);
                    _tempCol.copy(item.baseCol).multiplyScalar(intensity);
                    obj.setColorAt(i, _tempCol);
                }
                if(obj.instanceColor) obj.instanceColor.needsUpdate = true;
            }
            if(obj.userData.type === 'bulb' && obj.userData.baseCol) {
                const blink = 0.6 + 0.4 * Math.sin(time * 3.0 + obj.userData.phase);
                const intensity = 1.0 + blink * (CFG.bulbBri / 8);
                obj.material.color.copy(obj.userData.baseCol).multiplyScalar(intensity);
            }
            if(obj.userData.type === 'star') obj.material.color.setHSL(0.14, 1.0, 0.6 + 0.3 * Math.sin(time));
            if(obj.userData.type === 'headlight_spot') {
                obj.intensity = CFG.lightPow;
            }
            if(obj.userData.type === 'headlight_glare') {
                // 将光照强度 (0~200) 映射到 透明度 (0~0.6)
                // 避免完全不透明导致看起来像贴图 bug
                obj.material.opacity = Math.min(0.6, (CFG.lightPow / 100) * 0.3);
                obj.visible = CFG.lightPow > 1; // 关灯时隐藏
            }
        });
    }
};

// 渲染系统
const RenderingSystem = {
    update(deltaTime, time) {
        // 🎥 相机更新委托给导演系统
        if (CameraDirector) CameraDirector.update(deltaTime);

        if (controls) controls.update();
        if (composer) composer.render();
    }
};

// 初始化动画系统
AnimationSystem.addSystem(PhysicsSystem);
AnimationSystem.addSystem(TrainSystem);
AnimationSystem.addSystem(EffectsSystem);
AnimationSystem.addSystem(LightingSystem);
AnimationSystem.addSystem(RenderingSystem);

function animate() {
    requestAnimationFrame(animate);

    // Safety check
    if (!scene || !camera || !renderer) return;

    const dt = clock.getDelta();
    const time = clock.getElapsedTime();

    // 如果两帧间隔超过 0.1秒（比如切后台了），就强制按 0.1秒计算
    // 这样雪花就不会瞬间掉到底，火车也不会瞬移
    const deltaTime = dt > 0.1 ? 0.1 : dt;

    // 使用动画系统管理器更新所有子系统
    AnimationSystem.update(deltaTime, time);
}

function buildLights() {
    const moon = new THREE.DirectionalLight(0xaaccff, CFG.moonInt);
    // 调整月光位置：更低、更侧向，制造长阴影
    moon.position.set(-150, 80, -150);
    moon.castShadow=true; 
    
    // 🟢 阴影优化：大幅提升分辨率并收缩视口，解决漏光和锯齿
    moon.shadow.mapSize.set(4096, 4096); 
    moon.shadow.camera.left = -250; 
    moon.shadow.camera.right = 250;
    moon.shadow.camera.top = 250; 
    moon.shadow.camera.bottom = -250;
    moon.shadow.bias = -0.0005; 
    moon.shadow.normalBias = 0.05; 

    scene.add(moon); lights.moon = moon;

    // 月亮实体：超级月亮效果，挂在天边 (推远以消除视差，防止自由模式穿帮)
    const mMesh = new THREE.Mesh(new THREE.SphereGeometry(120,32,32), new THREE.MeshBasicMaterial({color:0xffffee, fog:false}));
    mMesh.position.set(-2000, 600, -2000); 
    scene.add(mMesh);

    // 星空
    const sg = new THREE.BufferGeometry();
    const sp = [];
    for(let i=0;i<3000;i++) {
        const r=800+Math.random()*200;
        const th=Math.random()*Math.PI*2;
        const ph=Math.acos(2*Math.random()-1);
        if(Math.cos(ph)<0) continue; // 只在天上
        sp.push(r*Math.sin(ph)*Math.cos(th), Math.abs(r*Math.cos(ph)), r*Math.sin(ph)*Math.sin(th));
    }
    sg.setAttribute('position', new THREE.Float32BufferAttribute(sp,3));
    scene.add(new THREE.Points(sg, new THREE.PointsMaterial({color:0xffffff, size:1.5, transparent:true, opacity:0.8, fog:false})));

    // 🟢 升级环境光为半球光 (HemisphereLight)
    // Sky: 月夜蓝灰 | Ground: 深邃地黑 | Intensity: 0.5 (足够照亮枕木细节)
    const hemiLight = new THREE.HemisphereLight(0x405070, 0x101010, 0.5);
    scene.add(hemiLight);
    
    // ⛰️ 地面地形 (Terrain)
    // 提取为独立函数，供其他对象（如轨道、树木）对齐高度
    window.getTerrainHeight = (x, z) => {
        const dist = Math.sqrt(x*x + z*z);
        let height = 0;
        
        // 核心逻辑：扩大中心平坦区 (R < 180)，让轨道大部分区域处于平原
        // 远山推后，且坡度更缓
        if (dist > 180) { 
            const h1 = Math.sin(x * 0.005) * Math.cos(z * 0.005) * 30; // 主山峰
            const h2 = Math.sin(x * 0.02 + z * 0.01) * 5; // 地面细节
            height = h1 + h2;
            
            // 边缘平滑过渡 (180 ~ 350)
            // 在此范围内，山势缓慢升起，轨道附近(max 200)只有轻微起伏
            if (dist < 350) height *= (dist - 180) / 170;
        }
        
        return height; 
    };

    // 🟢 修复：大幅提高地面网格精度 (128 -> 256)
    // 防止低模地面在山谷处"架桥"，导致精确贴地的轨道被埋在下面
    const groundGeo = new THREE.PlaneGeometry(2000, 2000, 256, 256);
    const pos = groundGeo.attributes.position;
    
    for(let i=0; i<pos.count; i++){
        const x = pos.getX(i);
        const y = pos.getY(i); // Plane Y is World Z
        
        // 使用统一的高度函数
        // 注意：Ground Mesh 本身没有 Y 偏移，所以顶点 Z (World Y) 直接设为地形高度
        // 为了让铁轨 (y=0.56) 不被埋住，地面中心高度设为 0，铁轨会有 0.56 的枕木高度，完美。
        // 但之前地面下沉了 -2.0，导致悬空。
        // 现在我们将地面中心设为 0。
        const h = window.getTerrainHeight(x, y);
        pos.setZ(i, h); 
    }
    
    groundGeo.computeVertexNormals();
    
    ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({
        color: 0xeef2f3, // 雪白略带灰
        roughness: 1.0, 
        metalness: 0.0
    }));
    ground.rotation.x = -Math.PI/2; 
    ground.receiveShadow = true;
    scene.add(ground);
}

function buildTrack() {
    const points = [];
    // 🟢 修复：增加轨道采样点 (100 -> 400)
    // 配合高精度地面，确保轨道不会在两个采样点之间被地形"切"到
    const segments = 400; 
    
    // 🟢 形状优化：明确的三叶草/指尖陀螺结构
    const BaseR = 150; 
    const Amp = 50; 

    // 随机旋转整个轨道，每次刷新都不一样，但形状保持三叶草
    // 🟢 使用全局 STATE 中的相位，确保与地形生成逻辑同步
    const globalPhase = STATE.trackPhase;

    // --- 🌟 计算英雄树的完美布局点 ---
    // 三叶草的三个叶片(波峰)分别出现在 cos(3θ + phase) = 1 时
    // 即 3θ + phase = 0, 2π, 4π
    // θ = (2kπ - phase) / 3
    STATE.treeLayout = [];
    for(let k=0; k<3; k++) {
        const thetaPeak = (2 * k * Math.PI - globalPhase) / 3;
        // 树的位置：在波峰角度上，但半径稍小，被轨道包围
        // 轨道最大半径 BaseR + Amp = 200
        // 我们把树放在 R = 130 处，留出 70 的安全距离
        const rTree = 130; 
        STATE.treeLayout.push({
            x: rTree * Math.cos(thetaPeak),
            z: rTree * Math.sin(thetaPeak),
            angle: thetaPeak
        });
    }
    // 标记第一棵为主树
    STATE.mainTreePos = new THREE.Vector3(STATE.treeLayout[0].x, 0, STATE.treeLayout[0].z);

    for (let i = 0; i < segments; i++) {
        const theta = (i / segments) * Math.PI * 2;
        const phase = globalPhase; 
        
        const r = BaseR + Amp * Math.cos(3 * theta + phase);
        const x = r * Math.cos(theta);
        const z = r * Math.sin(theta);
        
        // 🟢 智能定高：计算切线和法线，探测轨道两侧的地形高度
        const dr = -3 * Amp * Math.sin(3 * theta + phase);
        const dx = dr * Math.cos(theta) - r * Math.sin(theta);
        const dz = dr * Math.sin(theta) + r * Math.cos(theta);
        
        // 法线 (Normalized)
        const len = Math.sqrt(dx*dx + dz*dz);
        const nx = -dz / len;
        const nz = dx / len;
        
        // 采样三个点 (中、左、右)
        // 宽度 buffer = 3.5米 (精确匹配路基底宽，避免探测太远导致轨道莫名抬高)
        const hC = window.getTerrainHeight ? window.getTerrainHeight(x, z) : 0;
        const hL = window.getTerrainHeight ? window.getTerrainHeight(x + nx*3.5, z + nz*3.5) : 0;
        const hR = window.getTerrainHeight ? window.getTerrainHeight(x - nx*3.5, z - nz*3.5) : 0;
        
        // 取最大值：确保路基边缘不会切入地下
        const terrainH = Math.max(hC, hL, hR);
        
        // 🟢 最终定版：1.55m (兼顾贴地感与防穿模的最佳平衡点)
        points.push(new THREE.Vector3(x, terrainH + 1.55, z));
    }

    // 曲线生成
    trackCurve = new THREE.CatmullRomCurve3(points, true, 'centripetal', 0.5);
    trackCurve.arcLengthDivisions = 4000; 
    trackCurve.updateArcLengths();
    
    // ==========================================
    // 🏗️ 构建复合路基 (Ballast + Vertical Snow Curtain)
    // ==========================================
    const bedSegments = 800; 
    
    // 1. 道砟 (Ballast) - 深色碎石
    const ballastGeo = new THREE.BufferGeometry();
    const balPos = [];
    const balIndices = [];
    
    // 2. 垂直挡雪墙 (Snow Curtain) - 替代水平裙边，防止弯道自相交
    const skirtGeo = new THREE.BufferGeometry();
    const skirtPos = [];
    const skirtIndices = [];

    // 参数设定
    const ballastTopW = 2.2;    
    const ballastBotW = 3.5;    
    const ballastHeight = 0.8;  
    
    // 🟢 垂直墙逻辑：不需要 skirtWidth，而是直接垂直到地下
    const curtainDepthOffset = 2.0; // 插入地下的深度

    const upVec = new THREE.Vector3(0, 1, 0);
    const rightVec = new THREE.Vector3();
    const tanVec = new THREE.Vector3();
    const centerPos = new THREE.Vector3();

    // 辅助点
    const pTopL = new THREE.Vector3();
    const pTopR = new THREE.Vector3();
    const pBotL = new THREE.Vector3();
    const pBotR = new THREE.Vector3();
    
    // 墙底点 (Underground)
    const pCurtainL = new THREE.Vector3();
    const pCurtainR = new THREE.Vector3();

    const railPointsL = [];
    const railPointsR = [];
    const railDist = 1.8; 

    trackPoints = []; 

    for (let i = 0; i <= bedSegments; i++) {
        const t = (i % bedSegments) / bedSegments;
        
        trackCurve.getPointAt(t, centerPos);
        trackCurve.getTangentAt(t, tanVec);
        rightVec.crossVectors(tanVec, upVec).normalize();

        if (i < bedSegments) trackPoints.push(centerPos.clone());

        // --- 计算关键点 ---
        
        // A. 道砟顶面
        pTopL.copy(centerPos).addScaledVector(rightVec, -ballastTopW);
        pTopR.copy(centerPos).addScaledVector(rightVec, ballastTopW);
        
        // B. 道砟底面
        const botY = centerPos.y - ballastHeight;
        pBotL.copy(centerPos).addScaledVector(rightVec, -ballastBotW); pBotL.y = botY;
        pBotR.copy(centerPos).addScaledVector(rightVec, ballastBotW); pBotR.y = botY;

        // C. 挡雪墙底边 (Underground Curtain) - 🟢 核心逻辑
        // X/Z 坐标与道砟底边完全一致 (垂直向下)
        pCurtainL.copy(pBotL);
        pCurtainR.copy(pBotR);
        
        // 采样地形高度，并确保墙底深埋地下
        const hL = window.getTerrainHeight ? window.getTerrainHeight(pCurtainL.x, pCurtainL.z) : 0;
        const hR = window.getTerrainHeight ? window.getTerrainHeight(pCurtainR.x, pCurtainR.z) : 0;
        
        // 墙底高度 = 地形高度 - 2.0米
        // 这样墙面就从道砟底部一直延伸到地底，无论地形高低，看起来都像路基切入雪中
        pCurtainL.y = Math.min(botY - 0.5, hL - curtainDepthOffset); 
        pCurtainR.y = Math.min(botY - 0.5, hR - curtainDepthOffset);

        // --- 填充数据 ---

        // 1. 道砟
        balPos.push(pTopL.x, pTopL.y, pTopL.z);
        balPos.push(pTopR.x, pTopR.y, pTopR.z);
        balPos.push(pBotL.x, pBotL.y, pBotL.z);
        balPos.push(pBotR.x, pBotR.y, pBotR.z);

        // 2. 挡雪墙
        skirtPos.push(pBotL.x, pBotL.y, pBotL.z);
        skirtPos.push(pBotR.x, pBotR.y, pBotR.z);
        skirtPos.push(pCurtainL.x, pCurtainL.y, pCurtainL.z);
        skirtPos.push(pCurtainR.x, pCurtainR.y, pCurtainR.z);

        // 索引
        if (i > 0) {
            const curr = i * 4;
            const prev = (i - 1) * 4;

            // 道砟
            balIndices.push(prev+0, prev+1, curr+0); balIndices.push(prev+1, curr+1, curr+0);
            balIndices.push(prev+2, prev+0, curr+2); balIndices.push(prev+0, curr+0, curr+2);
            balIndices.push(prev+1, prev+3, curr+1); balIndices.push(prev+3, curr+3, curr+1);

            // 挡雪墙 (垂直面)
            skirtIndices.push(prev+2, prev+0, curr+2); skirtIndices.push(prev+0, curr+0, curr+2);
            skirtIndices.push(prev+1, prev+3, curr+1); skirtIndices.push(prev+3, curr+3, curr+1);
        }

        const railY = centerPos.y + 0.18; // 🟢 降低铁轨高度，使其嵌入枕木，消除悬空感
        const rL = centerPos.clone().addScaledVector(rightVec, -railDist); rL.y = railY;
        const rR = centerPos.clone().addScaledVector(rightVec, railDist); rR.y = railY;

        if (i < bedSegments) {
            railPointsL.push(rL);
            railPointsR.push(rR);
        }
    }

    // --- 创建 Mesh ---

    // 1. 道砟 Mesh
    ballastGeo.setAttribute('position', new THREE.Float32BufferAttribute(balPos, 3));
    ballastGeo.setIndex(balIndices);
    ballastGeo.computeVertexNormals();
    const ballastMat = new THREE.MeshStandardMaterial({
        color: 0x506070, 
        roughness: 1.0,  
        metalness: 0.1,  
        side: THREE.FrontSide 
    });
    const ballast = new THREE.Mesh(ballastGeo, ballastMat);
    ballast.receiveShadow = true; // 🟢 开启接收阴影
    scene.add(ballast);

    // 2. 挡雪墙 Mesh
    skirtGeo.setAttribute('position', new THREE.Float32BufferAttribute(skirtPos, 3));
    skirtGeo.setIndex(skirtIndices);
    skirtGeo.computeVertexNormals();
    
    // 使用雪材质
    const skirtMat = new THREE.MeshStandardMaterial({
        color: 0xeef2f3, 
        roughness: 1.0, 
        metalness: 0.0,
        side: THREE.FrontSide 
    });
    const skirt = new THREE.Mesh(skirtGeo, skirtMat);
    skirt.receiveShadow = true; // 🟢 开启接收阴影
    scene.add(skirt);
    
    // 3. 枕木 (Sleepers)
    const sleeperDivs = 600;
    const pg = new THREE.BoxGeometry(4.2, 0.25, 0.8); // 尺寸微调，更像真实枕木
    const pm = new THREE.MeshStandardMaterial({color:0x4a3c31, roughness: 0.9}); // 深木色
    const pi = new THREE.InstancedMesh(pg, pm, sleeperDivs);
    
    const dum = new THREE.Object3D();
    const _up = new THREE.Vector3(0,1,0);
    const _right = new THREE.Vector3();
    const _fwd = new THREE.Vector3();
    const _mat4 = new THREE.Matrix4();

    for(let i=0; i<sleeperDivs; i++){
        const t = i/sleeperDivs; 
        const p = trackCurve.getPointAt(t); 
        const tan = trackCurve.getTangentAt(t);
        
        // 🟢 修复枕木倾斜：强制构建水平正交基 (右手坐标系)
        _fwd.copy(tan).normalize(); // Z轴：沿轨道切线
        _right.crossVectors(_up, _fwd).normalize(); // X轴：Y x Z = X (Right)
        const _trueUp = new THREE.Vector3().crossVectors(_fwd, _right).normalize(); // Y轴：Z x X = Y (Up)
        
        _mat4.makeBasis(_right, _trueUp, _fwd);
        _mat4.setPosition(p.x, p.y + 0.12, p.z);
        
        dum.matrix.copy(_mat4);
        dum.matrix.decompose(dum.position, dum.quaternion, dum.scale);
        dum.updateMatrix();
        pi.setMatrixAt(i, dum.matrix);
    }
    pi.receiveShadow = true; 
    scene.add(pi);

    // 4. 铁轨
    const curveL = new THREE.CatmullRomCurve3(railPointsL, true, 'catmullrom', 0.1);
    const curveR = new THREE.CatmullRomCurve3(railPointsR, true, 'catmullrom', 0.1);
    const railMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8, roughness: 0.4 });

    const railMeshL = new THREE.Mesh(new THREE.TubeGeometry(curveL, bedSegments, 0.12, 6, true), railMat);
    const railMeshR = new THREE.Mesh(new THREE.TubeGeometry(curveR, bedSegments, 0.12, 6, true), railMat);
    
    railMeshL.receiveShadow = true; // 🟢 开启接收阴影
    railMeshR.receiveShadow = true; // 🟢 开启接收阴影
    
    scene.add(railMeshL);
    scene.add(railMeshR);
}

function buildEnv() {
    // 1. 放置英雄树 (根据 buildTrack 计算出的完美布局点)
    if (STATE.treeLayout && STATE.treeLayout.length >= 3) {
        // 主树 (Main Hero Tree) - 放在第一个波峰怀抱中
        const main = STATE.treeLayout[0];
        createHeroTree(main.x, main.z, 3.2); // 巨大尺寸

        // 副树 (Side Trees) - 放在另外两个波峰
        const side1 = STATE.treeLayout[1];
        createHeroTree(side1.x, side1.z, 2.0);

        const side2 = STATE.treeLayout[2];
        createHeroTree(side2.x, side2.z, 2.0);
    } else {
        // 降级方案 (如果未初始化布局)
        createHeroTree(0, -90, 2.8);
        createHeroTree(85, 55, 1.4);
        createHeroTree(-85, 55, 1.4);
    }

    // 🌲 升级版森林 (Varied Forest)
    const matTree = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.9}); // 使用白色底，靠 instanceColor 染色
    const matSnow = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.6}); 
    
    const count = 1200; // 增加数量，因为有了地形
    
    // 我们不再分三层 Mesh，而是把一棵树合并成一个 Geometry 或者使用 Group (InstancedMesh 不支持 Group)
    // 为了性能，我们保持 bot/mid/top 分离的 InstancedMesh 结构，但要同步它们的变换
    
    const meshBot = new THREE.InstancedMesh(new THREE.ConeGeometry(3.5, 5, 7), matTree, count);
    const meshMid = new THREE.InstancedMesh(new THREE.ConeGeometry(2.5, 4, 7), matTree, count);
    const meshTop = new THREE.InstancedMesh(new THREE.ConeGeometry(1.5, 3, 7), matSnow, count); 
    
    meshBot.castShadow=true; meshBot.receiveShadow=true;
    meshMid.castShadow=true; meshMid.receiveShadow=true;
    
    const dummy = new THREE.Object3D();
    const color = new THREE.Color();
    let idx = 0;
    
    // 树木颜色库 (各种深浅不一的绿色)
    const treeGreens = [0x0f3315, 0x1a4a22, 0x0a2910, 0x2d5a36];

    // ⚡ 性能优化: 预计算轨道点的空间索引或直接遍历 (3000个点 x 1000个轨道点 = 3M次计算，JS能抗住，但可以优化)
    // 为了稳妥，我们使用步进遍历，只检查每隔几个点
    const trackCheckStep = 5; 
    const safeDistSq = 18 * 18; // 安全距离平方 (18 = 轨道宽 + 树冠宽 + 缓冲)

    for(let i=0; i<5000; i++) {
        if(idx >= count) break;
        const r = 160 + Math.random()*800; // 扩大范围到山丘上
        const a = Math.random()*6.28;
        const x = Math.cos(a)*r, z = Math.sin(a)*r;
        
        let safe = true;
        
        // 🛡️ 严谨的碰撞检测: 遍历轨道点
        for (let k = 0; k < trackPoints.length; k += trackCheckStep) {
            const tp = trackPoints[k];
            const dx = x - tp.x;
            const dz = z - tp.z;
            if (dx*dx + dz*dz < safeDistSq) {
                safe = false;
                break;
            }
        }

        if(safe) {
            // 🟢 修复：使用统一的地形高度函数，确保树木贴地
            const yBase = window.getTerrainHeight(x, z);

            // 随机变换

            // 随机变换
            const s = 0.8 + Math.random() * 1.5; 
            const sY = s * (0.8 + Math.random() * 0.6); // 高矮胖瘦不一
            const rotY = Math.random() * Math.PI * 2;
            
            // 随机颜色
            const baseHex = treeGreens[Math.floor(Math.random() * treeGreens.length)];
            color.setHex(baseHex);
            // 稍微加一点随机亮度
            color.offsetHSL(0, 0, (Math.random()-0.5)*0.1);

            // Bot
            dummy.position.set(x, yBase + 2.5*sY, z); 
            dummy.scale.set(s, sY, s); 
            dummy.rotation.y = rotY; 
            dummy.updateMatrix();
            meshBot.setMatrixAt(idx, dummy.matrix);
            meshBot.setColorAt(idx, color);

            // Mid
            dummy.position.set(x, yBase + 5.5*sY, z); 
            dummy.scale.set(s, sY, s); 
            dummy.updateMatrix();
            meshMid.setMatrixAt(idx, dummy.matrix);
            meshMid.setColorAt(idx, color);

            // Top (Snow)
            dummy.position.set(x, yBase + 8.0*sY, z); 
            dummy.scale.set(s, sY, s); 
            dummy.updateMatrix();
            meshTop.setMatrixAt(idx, dummy.matrix);
            // 雪顶保持白色，或者稍微带点环境蓝
            // meshTop.setColorAt(idx, ...); // 默认白

            idx++;
        }
    }
    
    scene.add(meshBot); scene.add(meshMid); scene.add(meshTop);

    // 🎨 装饰品 - 使用DecorManager优化
    for(let i=0; i<30; i++){
        const x=(Math.random()-0.5)*350, z=(Math.random()-0.5)*350;
        let safe=true;
        const r = Math.sqrt(x*x + z*z);
        if(r < 140) safe = false; // 避开轨道

        if(safe) {
            // 🟢 修复：使用统一的地形高度函数，确保装饰物贴地
            const rn = Math.random();
            if(rn < 0.3) DecorManager.addGroundGift(x, z);
            else if(rn < 0.6) DecorManager.addSnowman(x, z);
            else DecorManager.addLamp(x, z);
        }
    }
}

function createHeroTree(x, z, scale) {
    const g = new THREE.Group();
    g.position.set(x, 0, z);
    g.scale.set(scale, scale, scale);

    // 使用共享资源引用（简化代码）
    const { mats, geos } = HeroTreeResources;

    // 1. 树干 - 使用共享几何体和材质
    const trunk = new THREE.Mesh(geos.trunk, mats.trunk);
    trunk.position.y = 6;
    g.add(trunk);

    const bulbCols = [0xff0000, 0x00ff00, 0x0088ff, 0xffd700, 0xff00ff];

    // 🍬 拐杖糖 - 使用共享几何体
    const createCandyCane = () => {
        const cane = new THREE.Group();

        // 棍身 - 使用共享几何体
        const stick = new THREE.Mesh(geos.caneStick, mats.white);
        stick.position.y = 0.6; // stickH / 2 = 1.2 / 2

        // 弯钩 - 使用共享几何体
        const hook = new THREE.Mesh(geos.caneHook, mats.white);
        hook.position.set(0.35, 1.2, 0); // hookRadius, stickH

        // 棍身上的条纹 - 使用共享几何体
        for(let i=0; i<5; i++) {
            const stripe = new THREE.Mesh(geos.caneStripe, mats.red);
            stripe.position.y = 0.2 + i * 0.22;
            stripe.rotation.x = Math.PI / 2;
            stripe.rotation.y = 0.3;
            cane.add(stripe);
        }

        // 弯钩上的条纹
        const hookStripes = new THREE.Group();
        hookStripes.position.copy(hook.position);

        for(let i=1; i<4; i++) {
            const angle = (i / 4) * Math.PI;
            const stripe = new THREE.Mesh(geos.caneStripe, mats.red);
            stripe.position.set(Math.cos(angle) * 0.35, Math.sin(angle) * 0.35, 0);
            stripe.rotation.z = angle + Math.PI/2;
            hookStripes.add(stripe);
        }

        cane.add(stick, hook, hookStripes);
        cane.scale.set(1.2, 1.2, 1.2);
        cane.rotation.z = Math.PI / 6;

        return cane;
    };

    // 🎁 小礼物 - 使用共享几何体
    const createMiniGift = () => {
        const boxG = new THREE.Group();
        const mainMat = Math.random() > 0.5 ? mats.red : mats.gold;

        // 盒子主体 - 使用共享几何体
        const box = new THREE.Mesh(geos.giftBox, mainMat);

        // 十字丝带 - 使用共享几何体
        const r1 = new THREE.Mesh(geos.giftRibbon1, mats.white);
        const r2 = new THREE.Mesh(geos.giftRibbon2, mats.white);

        // 蝴蝶结
        const bowG = new THREE.Group();
        bowG.position.y = 0.5;

        const b1 = new THREE.Mesh(geos.bowLoop, mats.white);
        b1.position.set(0.15, 0.15, 0);
        b1.rotation.set(0, 0, -Math.PI / 4);

        const b2 = new THREE.Mesh(geos.bowLoop, mats.white);
        b2.position.set(-0.15, 0.15, 0);
        b2.rotation.set(0, 0, Math.PI / 4);

        const knot = new THREE.Mesh(geos.bowKnot, mats.white);

        bowG.add(b1, b2, knot);
        boxG.add(box, r1, r2, bowG);
        boxG.rotation.set(Math.random()*0.5, Math.random()*Math.PI, Math.random()*0.5);

        return boxG;
    };

    const tiers = [
        { r: 24, h: 16, y: 14 }, { r: 20, h: 15, y: 24 },
        { r: 16, h: 14, y: 34 }, { r: 11, h: 12, y: 43 },
        { r: 6,  h: 10, y: 51 }
    ];
    let treeTopY = 0;

    tiers.forEach((tier, index) => {
        const geo = new THREE.ConeGeometry(tier.r, tier.h, 8);
        const mesh = new THREE.Mesh(geo, mats.foliage);
        mesh.position.y = tier.y;
        mesh.rotation.y = (index % 2) * (Math.PI / 8);
        mesh.castShadow = true; mesh.receiveShadow = true;
        g.add(mesh);
        treeTopY = tier.y + tier.h / 2;

        // --- 装饰品：使用共享几何体 ---
        const decorCount = Math.floor(tier.r * 0.8) + 2;
        for (let k = 0; k < decorCount; k++) {
            const angle = Math.random() * Math.PI * 2;
            const v = 0.1 + Math.random() * 0.5;
            const surfR = tier.r * (1 - v);
            const embed = 0.85 + Math.random() * 0.15;

            const lx = Math.cos(angle) * surfR * embed;
            const lz = Math.sin(angle) * surfR * embed;
            const ly = -tier.h / 2 + v * tier.h;

            const type = Math.random();
            let decor;
            if (type < 0.4) {
                // 装饰球 - 使用共享几何体
                decor = new THREE.Mesh(geos.ball, Math.random()>.5 ? mats.red : mats.gold);
                decor.position.set(lx, ly, lz);
            } else if (type < 0.7) {
                decor = createMiniGift();
                decor.position.set(lx, ly + 0.5, lz);
                decor.rotation.set(Math.random()*0.5, Math.random()*Math.PI, Math.random()*0.5);
            } else {
                decor = createCandyCane();
                decor.position.set(lx, ly, lz);
                decor.lookAt(0, ly, 0);
                decor.rotateX(Math.PI/4);
            }
            mesh.add(decor);
        }
    });

    // --- 🌟 实体电线 (随机布线逻辑) ---
    const wirePoints = [];
    wirePoints.push(new THREE.Vector3(0, 2, 2)); // 起点
    let currentAngle = 0;

    tiers.forEach((tier) => {
        // 盘旋：0.5 ~ 1.5 圈
        const loops = 0.5 + Math.random() * 1.0; 
        const steps = 15; // 细分
        
        for(let s=0; s <= steps; s++) {
            const t = s / steps;
            
            // 角度推进
            const angleStep = (Math.PI * 2 * loops) / steps;
            currentAngle += angleStep;
            
            // 高度：在当前层爬升
            // 只爬到 70% 高度，留出钻回去的空间
            const py = (tier.y - tier.h/2) + (tier.h * 0.7) * t;
            
            // 半径：从表面稍微浮起
            const surfR = tier.r * (1 - t * 0.7); // 随高度变细
            const r = surfR * 1.05 + Math.random(); // 随机松弛
            
            const px = Math.cos(currentAngle) * r;
            const pz = Math.sin(currentAngle) * r;
            wirePoints.push(new THREE.Vector3(px, py, pz));
        }

        // C. 钻回：回到树干附近，准备去下一层
        const endH = tier.y + tier.h/2 - 1;
        wirePoints.push(new THREE.Vector3(2 * Math.cos(currentAngle), endH, 2 * Math.sin(currentAngle)));
    });
    // 终点
    wirePoints.push(new THREE.Vector3(0, treeTopY, 0));

    const curve = new THREE.CatmullRomCurve3(wirePoints);
    const tubeGeo = new THREE.TubeGeometry(curve, 300, 0.08, 6, false);
    const wireMesh = new THREE.Mesh(tubeGeo, mats.black); // 使用共享材质
    g.add(wireMesh);

    // --- 🌟 LED 灯珠 (稀疏分布 + 局部点光源) ---
    const totalLength = curve.getLength();
    const bulbCountRaw = Math.floor(totalLength * 1.8);

    // LED材质需要独立创建（MeshBasicMaterial 用于发光效果）
    const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false });
    const ledMesh = new THREE.InstancedMesh(geos.bulb, bulbMat, bulbCountRaw); // 使用共享几何体
    
    const dummy = new THREE.Object3D();
    const ledData = [];
    let realCount = 0;
    let clusterState = false; 
    let clusterCounter = 0;

    for(let i=0; i<bulbCountRaw; i++) {
        const t = i / bulbCountRaw;
        
        if (clusterCounter <= 0) {
            clusterState = !clusterState;
            clusterCounter = clusterState ? Math.floor(Math.random() * 5 + 4) : Math.floor(Math.random() * 12 + 8);
        }
        clusterCounter--;
        if (!clusterState) continue;

        const pos = curve.getPointAt(t);
        // 随机偏移
        pos.x += (Math.random()-0.5)*0.3;
        pos.y += (Math.random()-0.5)*0.3;
        pos.z += (Math.random()-0.5)*0.3;

        dummy.position.copy(pos);
        dummy.scale.setScalar(1.0);
        dummy.updateMatrix();
        ledMesh.setMatrixAt(realCount, dummy.matrix);
        
        const colHex = bulbCols[Math.floor(Math.random() * bulbCols.length)];
        const color = new THREE.Color(colHex);
        ledMesh.setColorAt(realCount, color);
        
        ledData.push({ id: realCount, baseCol: color, speed: 0.5 + Math.random() * 3.0, offset: Math.random() * 100 });
        realCount++;
    }
    
    ledMesh.count = realCount;
    ledMesh.instanceColor.needsUpdate = true;
    ledMesh.userData = { type: 'led_instanced', data: ledData };
    emissives.push(ledMesh);
    g.add(ledMesh);

    if (scale > 2.0) {
        // 核心主光源 (照亮中下部)
        const innerLight = new THREE.PointLight(0xffdd44, 500, 100);
        innerLight.position.set(0, 15, 0);
        
        // 顶部补光 (照亮上部)
        const topLight = new THREE.PointLight(0xffdd44, 300, 60);
        topLight.position.set(0, 35, 0);
        
        g.add(innerLight, topLight);
    }

    // --- 🌟 树顶星星 (修复版：无缺口) ---
    const starShape = new THREE.Shape();
    const pts = 5;
    const outerR = 4.2; 
    const innerR = 2.0; 
    // 从正上方开始画 (Angle = -PI/2)
    for (let i = 0; i < pts * 2; i++) {
        const r = (i % 2 === 0) ? outerR : innerR;
        const a = (i / 10) * Math.PI * 2 - Math.PI/2;
        if(i===0) starShape.moveTo(Math.cos(a)*r, Math.sin(a)*r);
        else starShape.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    starShape.closePath();

    // 减小 bevel 防止自相交缺口
    const starGeo = new THREE.ExtrudeGeometry(starShape, { 
        depth: 1.0, 
        bevelEnabled: true, 
        bevelThickness: 0.1, 
        bevelSize: 0.1, 
        bevelSegments: 1 
    });
    starGeo.center();
    
    const star = new THREE.Mesh(starGeo, new THREE.MeshBasicMaterial({ color: 0xffeb3b, fog: false }));
    star.position.set(0, treeTopY + 3.5, 0);
    star.userData = { type: 'star' }; 
    emissives.push(star); 
    g.add(star);
    
    scene.add(g);
}

class Train {
    constructor(sc, curve) {
        this.sc = sc; // Save scene reference for trails
        this.grp=new THREE.Group(); sc.add(this.grp);
        this.curve=curve; this.prog=0; this.wheels=[]; this.smokes=[];
        this.smokeMax = 30; // 使用硬编码值，保持原有配置
        this.smokeIdx = 0;
        this.smokeData = [];
        
        // 🛠️ GC 优化：预分配几何体和材质 (Flyweight Pattern)
        // 避免每节车厢都 new Geometry，共用一份资源
        this.sharedResources = {

            connectorGeo: new THREE.BoxGeometry(2.4, 2.8, 1.2),
            wheelGeo: new THREE.CylinderGeometry(0.65, 0.65, 0.4, 12).rotateZ(Math.PI / 2),
            // [MODIFIED] 使用 StandardMaterial 以支持发光闪烁 (emissive flash)
            winMat: new THREE.MeshStandardMaterial({ 
                color: 0xffcc00, // 更明亮的暖黄
                emissive: 0xffaa00,

        };

        const sMat = new THREE.MeshStandardMaterial({

        });
        this.smokeMesh = new THREE.InstancedMesh(sGeo, sMat, this.smokeMax);

        this.grp.add(this.smokeMesh);

        // 预先创建辅助对象，避免反复创建

        for(let i=0; i<this.smokeMax; i++) {

            this.smokeMesh.setMatrixAt(i, this.dummy.matrix);

        const cv=document.createElement('canvas'); cv.width=64;cv.height=64;

    }

    mkCar(i) {
        const g = new THREE.Group();
        const cols = [0x8b0000, 0x004d26, 0x003366, 0xb8860b];
        const col = cols[(i - 1) % 4];
        
        const matBody = new THREE.MeshStandardMaterial({ color: col, roughness: 0.4, metalness: 0.2 });
        const matGold = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3, metalness: 0.8 });

        // 1. 车身 (共享 Geo)
        const body = new THREE.Mesh(this.sharedResources.bodyGeo, matBody);
        body.position.y = 3.3;
        
        // 2. 金色装饰 (共享 Geo)
        const goldBand = new THREE.Mesh(this.sharedResources.goldBandGeo, matGold);
        goldBand.position.y = 3.0; 
        g.add(goldBand);
        
        // 3. 车顶 (共享 Geo)
        const roof = new THREE.Mesh(
            this.sharedResources.roofGeo,
            new THREE.MeshStandardMaterial({color:0x222, roughness:0.9}) 
        );
        roof.rotation.set(0, Math.PI/2, Math.PI/2);
        roof.scale.set(1, 0.65, 1);
        
        // 🔧 修正：抬高车顶位置
        // 车身 body 高度 3.8，中心在 3.3，顶面在 3.3 + 1.9 = 5.2
        // 车顶是半圆柱，轴心应该刚好在 5.2
        const roofBaseY = 5.2;
        roof.position.set(0, roofBaseY, 0);

        // 3.5 车顶积雪 - 升级版 (Improved Snow Blanket - High Fidelity Restored)
        // 1. 创建高细分的基础几何体
        // 恢复高细分 (64,40) 以支持精细的噪声变形，正如分析报告所述
        const snowGeo = new THREE.CylinderGeometry(2.05, 2.05, 13, 64, 40, true, 0, Math.PI);
        
        const posAttr = snowGeo.attributes.position;
        const vertex = new THREE.Vector3();
        
        // --- A. 随机噪声签名 (Noise Signature) ---
        // 为每节车厢生成完全不同的噪声特征
        const freqBase = 1.5 + Math.random() * 2.5; 
        const freqDetail = 5.0 + Math.random() * 5.0; 
        const ampBase = 0.12 + Math.random() * 0.08; 
        const ampDetail = 0.04 + Math.random() * 0.04;
        const phaseL = Math.random() * 100;
        const phaseR = Math.random() * 100;
        const snowThickBase = 0.2 + Math.random() * 0.08;

        for (let k = 0; k < posAttr.count; k++) {
            vertex.fromBufferAttribute(posAttr, k);
            
            // 1. 恢复原始 Theta
            let theta = Math.atan2(vertex.x, vertex.z);
            if (theta < 0) theta += Math.PI * 2;
            
            // --- B. 边缘融化与垂落 (Edge Dripping) ---
            const microNoise = Math.sin(vertex.y * 20 + vertex.x * 10 + k) * 0.02;

            // 左侧边缘噪声
            const noiseL = Math.sin(vertex.y * freqBase + phaseL) * ampBase + 
                           Math.sin(vertex.y * freqDetail + phaseL * 1.5) * ampDetail + 
                           Math.sin(vertex.y * 0.5 + phaseL) * 0.05 + 
                           microNoise;

            // 右侧边缘噪声
            const noiseR = Math.sin(vertex.y * (freqBase * 1.1) + phaseR) * ampBase + 
                           Math.sin(vertex.y * (freqDetail * 0.9) + phaseR * 1.2) * ampDetail +
                           Math.sin(vertex.y * 0.6 + phaseR) * 0.05 +
                           microNoise;

            // 动态调整覆盖范围 (theta 起止点)
            const startTheta = 0.3 + Math.abs(noiseL) * 0.6; 
            const endTheta = Math.PI - (0.3 + Math.abs(noiseR) * 0.6);
            
            // 映射 Theta
            const newTheta = startTheta + (theta / Math.PI) * (endTheta - startTheta);
            
            // 重建位置 (基于新 Theta)
            const r = 2.05;
            vertex.x = r * Math.sin(newTheta);
            vertex.z = r * Math.cos(newTheta);
            
            // --- C. 表面起伏与堆积 (Surface Lumpiness) ---
            const nx = Math.sin(newTheta);
            const nz = Math.cos(newTheta);
            
            let thick = snowThickBase;
            thick += Math.sin(vertex.x * 3 + vertex.y * 1.5 + phaseL) * 0.04; 
            thick += Math.sin(vertex.z * 4 + phaseR) * 0.02;
            thick += microNoise * 0.5;
            
            // --- D. 体积堆积逻辑 (Volumetric Piling) ---
            // 顶部加厚
            const distFromTop = Math.abs(newTheta - Math.PI/2);
            thick += 0.12 * Math.max(0, 1.0 - distFromTop / (Math.PI/2)); 

            // 边缘打薄
            const edgeRatio = distFromTop / (Math.PI/2);
            if (edgeRatio > 0.6) {
                thick *= Math.max(0.2, 1.0 - (edgeRatio - 0.6) * 2.0); 
            }

            vertex.x += nx * thick;
            vertex.z += nz * thick;

            // --- E. 重力垂落 (Gravity Droop) ---
            const edgeFactor = Math.pow(Math.max(0, distFromTop / (Math.PI/2)), 6);
            const droop = 0.05 * edgeFactor * (1 + Math.random()*0.2); 
            vertex.x -= droop;

            // --- F. 前后圆润化 (End Rounding) ---
            const distFromEnd = 6.5 - Math.abs(vertex.y);
            if (distFromEnd < 0.8) {
                const t = (0.8 - distFromEnd) / 0.8;
                const endDroop = t * t * 0.6; 
                vertex.x -= endDroop;
            }

            posAttr.setXYZ(k, vertex.x, vertex.y, vertex.z);
        }
        
        snowGeo.computeVertexNormals();

        const snowCap = new THREE.Mesh(snowGeo, CarSnowResources.mat);
        snowCap.rotation.set(0, Math.PI/2, Math.PI/2);
        snowCap.scale.set(1, 0.65, 1); 
        snowCap.position.set(0, roofBaseY, 0);

        g.add(snowCap);

        // 4. 车窗 (共享 Geo)
        const windows = [];
        for (let side = -1; side <= 1; side += 2) {
            for (let k = 0; k < 3; k++) {
                const w = new THREE.Mesh(this.sharedResources.winGeo, this.sharedResources.winMat.clone()); 
                const border = new THREE.Mesh(this.sharedResources.borderGeo, matGold);

                w.position.set(1.76 * side, 3.8, -2.5 + k * 2.5);
                w.rotation.y = side * Math.PI / 2;
                w.userData.isWindow = true; 
                windows.push(w);

                border.position.copy(w.position);
                border.position.x -= 0.01 * side; 
                border.rotation.copy(w.rotation);

                g.add(border);
                g.add(w);
            }
        }
        g.userData.windows = windows; 

        // 5. 连接处 & 轮子 (共享 Geo)
        const gw = new THREE.Mesh(this.sharedResources.connectorGeo, new THREE.MeshStandardMaterial({ color: 0x111 }));
        gw.position.set(0, 3, 4.2);

        const ab = z => {
            const gr = new THREE.Group(); gr.position.set(0, 0, z);
            const w = new THREE.Mesh(this.sharedResources.wheelGeo, new THREE.MeshStandardMaterial({ color: 0x111 }));
            w.position.set(1.6, 0.65, 0);
            const w2 = w.clone(); w2.position.set(-1.6, 0.65, 0);
            gr.add(w, w2); g.add(gr); this.wheels.push(w, w2);
        };
        ab(2.8); ab(-2.8);

        g.add(body, roof, gw);
        return g;
    }

    update(dt, speed) {
        audio.chug(speed);

        // 🚂 支持双向行驶：STATE.trainDir = 1(顺时针) 或 -1(逆时针)
        const dist = speed * dt * 0.2 * STATE.trainDir;
        this.prog = (this.prog + dist + 1) % 1; // +1 确保结果为正

        this.place(this.loco, this.prog);
        this.cars.forEach(c => {
            // 车厢跟随：根据方向决定偏移方向
            let t = this.prog - c.userData.off * STATE.trainDir;
            t = ((t % 1) + 1) % 1; // 确保 t 在 [0, 1) 范围内
            this.place(c, t);
        });

        // 轮子旋转方向也要随火车方向
        this.wheels.forEach(w => w.rotation.x -= dist * 150 * CFG.wheelMult);

        // 🎄 狂欢模式：车厢摇摆 (Party Rocking)
        if (STATE.christmasParty) {
            const t = clock.getElapsedTime();
            [this.loco, ...this.cars].forEach((obj, i) => {
                // 左右摇摆 (Roll) - 增加 Z 轴旋转
                obj.rotation.z += Math.sin(t * 18 + i) * 0.08;
                // 欢快跳动 (Bounce) - 增加 Y 轴位移
                obj.position.y += Math.abs(Math.sin(t * 25 + i)) * 0.15;
            });
        }

        // 🚂 烟雾生成逻辑优化
        // 确保矩阵更新，以获取准确的烟囱位置
        this.loco.updateMatrixWorld(true);
        this.chim.updateMatrixWorld(true);

        // 冒烟概率：保底 0.05 (静止也有呼吸感) + 速度加成
        const smokeProb = 0.05 + Math.min(speed * 5.0, 0.8);

        if(Math.random() < smokeProb) {
            vec3.setFromMatrixPosition(this.chim.matrixWorld);
            // 从烟囱顶部喷出 (y轴向上偏移)
            vec3.y += 1.2;
            this.spawnSmoke(vec3, speed);
        }

        this.updateSmoke(speed);
        this.updateDroppedGifts(dt);
    }

    spawnSmoke(pos, trainSpeed) {
        const idx = this.smokeIdx;
        const s = this.smokeData[idx];

        s.active = true;
        s.life = 1.0 + Math.random() * 0.5; 
        s.scale = 0.6 + Math.random() * 0.4; 
        s.pos = pos.clone();
        s.trainSpeed = trainSpeed; 

        this.loco.getWorldQuaternion(this._tempQuat);
        this._tempUp.set(0, 1, 0).applyQuaternion(this._tempQuat).normalize();

        // 修正：大幅降低速度对喷射力度的影响系数
        // 基础 2.5，最大增量也就 +3.2 (当 speed=0.4时)
        // 这样高速时虽然喷得快，但不会窜上天
        const burstPower = 2.5 + trainSpeed * 8.0; 

        s.vel.copy(this._tempUp).multiplyScalar(burstPower);

        // 修正：减小随机湍流，让烟柱更凝聚
        s.vel.x += (Math.random() - 0.5) * 0.6;
        s.vel.z += (Math.random() - 0.5) * 0.6;

        this.smokeIdx = (this.smokeIdx + 1) % this.smokeMax;
    }

    updateSmoke(currentSpeed) {
        let dirty = false;

        // 💨 动态风场计算 (Dynamic Wind Field)
        const t = clock.getElapsedTime();
        // 基础风力 + 阵风扰动
        const windX = (Math.sin(t * 0.8) + Math.sin(t * 2.5) * 0.6) * 0.015;
        const windZ = (Math.cos(t * 0.6) + Math.sin(t * 1.9) * 0.6) * 0.015;

        // 🛡️ 树木避障参数
        const treePos = STATE.mainTreePos;
        // 修正：扩大到 100米，覆盖树冠边缘
        const treeRadiusSq = 100 * 100; 

        for(let i=0; i<this.smokeMax; i++) {
            const s = this.smokeData[i];
            if(!s.active) continue;

            // 1. 应用风力
            s.vel.x += windX;
            s.vel.z += windZ;

            // 🟢 避障逻辑：气流偏转场
            if (treePos) {
                const dx = s.pos.x - treePos.x;
                const dz = s.pos.z - treePos.z;
                const dSq = dx*dx + dz*dz;
                
                if (dSq < treeRadiusSq) {
                    const dist = Math.sqrt(dSq);
                    // 归一化方向 (从树心指向外)
                    const dirX = dx / dist;
                    const dirZ = dz / dist;

                    // A. 侧向推力 (指数级增强)
                    // 离得越近，推力越强，但力度适中
                    const pushFactor = Math.pow((100 - dist) / 40, 2) * 0.12;
                    
                    s.vel.x += dirX * pushFactor;
                    s.vel.z += dirZ * pushFactor;

                    // B. 树下效应 (Under Canopy)
                    if (dist < 80) {
                        // 1. 温和压制：只减缓10%，保留上升感
                        s.vel.y *= 0.9; 
                        
                        // 2. 湍流扩散：撞击树枝产生的随机涡流
                        // 让烟雾向四周弥漫，而不仅仅是沿直线被推开
                        s.vel.x += (Math.random() - 0.5) * 0.15;
                        s.vel.z += (Math.random() - 0.5) * 0.15;
                    }
                }
            }

            // 2. 物理运动
            s.pos.add(s.vel);

            // 3. 空气阻力
            s.vel.multiplyScalar(0.85); 

            // 4. 热浮力
            if (s.vel.y < 0.8) {
                s.vel.y += 0.02; 
            }

            // 气体膨胀
            const age = 1.0 - (s.life / 1.5); 
            const expansion = 1.0 + age * 3.0; 
            
            s.life -= 0.016;

            if(s.life <= 0) {
                s.active = false;
                this.dummy.position.set(0, -1000, 0);
                this.dummy.updateMatrix();
                if (this.smokeMesh) this.smokeMesh.setMatrixAt(i, this.dummy.matrix);
                dirty = true;
                continue;
            }

            // 更新变换
            this.dummy.position.copy(s.pos);
            this.dummy.scale.setScalar(s.scale * expansion);
            this.dummy.rotation.set(age, age, age);
            this.dummy.updateMatrix();

            if (this.smokeMesh) this.smokeMesh.setMatrixAt(i, this.dummy.matrix);
            dirty = true;
        }

        if(dirty && this.smokeMesh) this.smokeMesh.instanceMatrix.needsUpdate = true;
    }
    place(o, t) {
        if (!this.curve) return; 
        
        // 1. 获取当前位置
        const p = this.curve.getPointAt(t);
        o.position.copy(p);

        // 2. 🟢 姿态平滑修复 (Look Ahead Stabilization)
        // 不要使用 getTangentAt(t)，因为切线对微小起伏太敏感，导致车头剧烈抖动
        // 方案：让车头"看着"前方 0.5% 处的点，自然平滑掉高频抖动
        const lookAheadDist = 0.005; // 约等于前方 5-10米
        
        // 根据行驶方向决定看哪里
        const dir = STATE.trainDir; 
        
        // 计算目标点 t (处理循环边界)
        let targetT = t + (lookAheadDist * dir);
        if (targetT < 0) targetT += 1;
        if (targetT > 1) targetT -= 1;

        const lookAtPoint = this.curve.getPointAt(targetT);
        o.lookAt(lookAtPoint);
    }

    // 🎁 从车厢扔出礼盒
    throwGift(car) {
        if (!this.droppedGifts) {
            this.droppedGifts = [];
            this.giftCooldown = 0;
            this.buildGiftTemplate();
        }

        // 冷却检查 (Party模式更快)
        const cooldownTime = STATE.christmasParty ? 50 : 200;
        if (Date.now() - this.giftCooldown < cooldownTime) return false;
        this.giftCooldown = Date.now();

        // 创建礼盒
        const gift = GiftFactory.cloneWithUniqueMaterials(this.giftTemplate);

        // 随机颜色
        const colors = [0xcc0000, 0x00aa00, 0x0066cc, 0xffaa00];
        const colHex = colors[Math.floor(Math.random() * colors.length)];
        const col = new THREE.Color(colHex);
        
        // 设置颜色并开启自发光
        gift.traverse(c => {
            if (c.isMesh) {
                // 主体颜色
                if (c === gift.children[0]) c.material.color.set(col);
                
                // 开启发光
                c.material.emissive = new THREE.Color(c.material.color);
                c.material.emissiveIntensity = 0.8; // 初始亮度
            }
        });

        // 从车厢世界位置扔出
        const worldPos = new THREE.Vector3();
        car.getWorldPosition(worldPos);

        // 随机选择左侧或右侧 (-1 或 1)
        const side = Math.random() > 0.5 ? 1 : -1;

        // 获取车厢的“右”向量 (Local X axis)
        const rightVec = new THREE.Vector3(1, 0, 0).applyQuaternion(car.quaternion);
        
        // 获取车厢的“上”向量 (Local Y axis)
        const upVec = new THREE.Vector3(0, 1, 0).applyQuaternion(car.quaternion);

        // 起始位置：车厢侧面窗户高度
        gift.position.copy(worldPos);
        gift.position.addScaledVector(rightVec, side * 2.0); // 向外偏移
        gift.position.addScaledVector(upVec, 1.0); // 稍微向上
        gift.scale.set(0.5, 0.5, 0.5);

        this.sc.add(gift);

        // 计算抛出速度向量
        // 1. 基础侧向速度 (向外)
        const throwVel = rightVec.clone().multiplyScalar(side * (8 + Math.random() * 8)); 
        
        // 2. 垂直分量 (向上抛)
        throwVel.add(upVec.clone().multiplyScalar(5 + Math.random() * 5));

        // 3. 前后随机分量 (避免落点成一条直线)
        const forwardVec = new THREE.Vector3(0, 0, 1).applyQuaternion(car.quaternion);
        throwVel.add(forwardVec.multiplyScalar((Math.random() - 0.5) * 10));

        // 添加尾迹
        const trail = new GiftParticleTrail(this.sc, colHex);

        this.droppedGifts.push({
            mesh: gift,
            vel: throwVel,
            rotVel: new THREE.Vector3(
                (Math.random() - 0.5) * 0.5,
                (Math.random() - 0.5) * 0.5,
                (Math.random() - 0.5) * 0.5
            ),
            landed: false,
            trail: trail,
            life: 8.0, // 存活时间 (用于发光衰减)
            maxLife: 8.0
        });

        return true;
    }

    buildGiftTemplate() {
        // 使用共享工厂创建小号礼盒模板
        // ⚡ 性能优化: 明确 shadow=false
        this.giftTemplate = GiftFactory.createTemplate({ size: 2, bowMat: 'gold', shadow: false });
    }

    updateDroppedGifts(dt) {
        if (!this.droppedGifts) return;

        // 使用统一的物理更新
        for (const g of this.droppedGifts) {
            // 动态获取当前礼物位置的地形高度
            const terrainHeight = window.getTerrainHeight ? window.getTerrainHeight(g.mesh.position.x, g.mesh.position.z) : 0;
            const groundY = terrainHeight + 1; // 在地形高度基础上加1，使礼物稍微高于地面
            const landed = GiftFactory.updateGiftPhysics(g, dt, { gravity: 25, groundY: groundY });

            // 发光衰减 logic
            if (g.life > 0) {
                g.life -= dt;
                // 线性衰减发光强度
                const intensity = Math.max(0, (g.life / g.maxLife) * 0.8);
                g.mesh.traverse(c => {
                    if (c.isMesh) c.material.emissiveIntensity = intensity;
                });
            }

            // 更新尾迹
            if (g.trail) {
                // 如果已落地，尾迹快速消失
                const trailOpacity = g.landed ? 0 : 1.0;
                // 如果未落地，尾迹透明度也可以随时间略微衰减
                g.trail.update(g.mesh.position, trailOpacity);
                
                // 如果已落地且尾迹几乎不可见（或简单地落地即销毁），清理尾迹
                if (g.landed) {
                     g.trail.dispose();
                     g.trail = null;
                }
            }
        }

        // 限制地面礼盒数量 (增加到 60)
        let removeCount = 0;
        const maxGifts = STATE.christmasParty ? 80 : 30;
        
        while (this.droppedGifts.length > maxGifts && removeCount < 2) {
            removeCount++;
            const oldest = this.droppedGifts.shift();
            scene.remove(oldest.mesh);
            if (oldest.trail) oldest.trail.dispose();

            // 🗑️ 内存清理
            oldest.mesh.traverse(child => {
                if (child.isMesh) {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                }
            });
        }
    }

    // 💡 车厢窗户闪烁效果
    flashWindows(car) {
        const windows = car.userData.windows;
        if (!windows || windows.length === 0) return;

        // 记录原始颜色
        const originalColors = windows.map(w => w.material.color.getHex());

        // 闪烁序列
        let flashCount = 0;
        const maxFlash = 6; // 闪3次 (on-off-on-off-on-off)
        const flashInterval = setInterval(() => {
            const bright = flashCount % 2 === 0;
            windows.forEach(w => {
                if (bright) {
                    // 亮状态：高强度爆闪
                    w.material.color.setHex(0xffffff);
                    w.material.emissive.setHex(0xffffff);
                    w.material.emissiveIntensity = 3.0; 
                } else {
                    // 暗状态：恢复默认暖光 (而不是全黑)
                    w.material.color.setHex(0xffccaa);
                    w.material.emissive.setHex(0xffaa00);
                    w.material.emissiveIntensity = 0.8;
                }
            });
            flashCount++;
            if (flashCount >= maxFlash) {
                clearInterval(flashInterval);
                // 恢复原色 (默认暖光)
                windows.forEach((w, i) => {
                    w.material.color.setHex(originalColors[i]);
                    w.material.emissive.setHex(0xffaa00);
                    w.material.emissiveIntensity = 0.8;
                });
            }
        }, 80);
    }
}

class Fireworks {
    constructor(sc) {
        this.sc = sc;
        this.activeRockets = [];

        // 纹理生成
        const c = document.createElement('canvas'); c.width=32; c.height=32;
        const x = c.getContext('2d'); 
        const g = x.createRadialGradient(16,16,0,16,16,16);
        g.addColorStop(0,'#fff'); g.addColorStop(1,'transparent'); 
        x.fillStyle=g; x.fillRect(0,0,32,32);
        this.tex = new THREE.CanvasTexture(c);
        
        this.cols = [[0xff0000,0xffaa00],[0x00ffff,0x0000ff],[0xff00ff,0xffaaaa],[0x00ff00,0xffff00]];
        this.sharedMat = new THREE.PointsMaterial({
            size: 8.0, map: this.tex, transparent: true, depthWrite: false,
            blending: THREE.AdditiveBlending, vertexColors: true
        });

        // 火箭共享材质
        this.rocketMat = new THREE.PointsMaterial({
            color: 0xffddaa, size: 5, map: this.tex,
            blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
        });
        // 火箭共享几何体（单点）
        this.rocketGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0)]);

        // 复用颜色对象
        this._tempColor = new THREE.Color();

        // --- 对象池初始化 ---
        this.poolSize = 10; // Reduced from 15
        this.particlesPerExplosion = 60; // Reduced from 80
        this.pool = [];

        for(let i=0; i<this.poolSize; i++) {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(this.particlesPerExplosion * 3);
            const col = new Float32Array(this.particlesPerExplosion * 3);
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

            const m = new THREE.Points(geo, this.sharedMat);
            m.frustumCulled = false; // 避免视锥剔除计算
            m.visible = false;
            this.sc.add(m);

            this.pool.push({
                mesh: m,
                velocities: new Float32Array(this.particlesPerExplosion * 3), // 预分配速度数组
                life: 0,
                available: true
            });
        }
    }

    launch(pos) {
        // 火箭 - 使用共享几何体和材质
        if(!pos) pos = new THREE.Vector3((Math.random()-0.5)*50, -5, (Math.random()-0.5)*50);
        const ty = pos.y + 50 + Math.random()*40;
        const pal = this.cols[Math.floor(Math.random()*this.cols.length)];

        const m = new THREE.Points(this.rocketGeo, this.rocketMat); // 使用共享资源
        m.position.copy(pos);
        this.sc.add(m);

        this.activeRockets.push({
            m, pos: pos.clone(),
            vel: new THREE.Vector3((Math.random()-0.5)*0.5, Math.sqrt(2*0.02*(ty-pos.y)), (Math.random()-0.5)*0.5),
            pal
        });
    }

    update() {
        // 1. 更新火箭
        for(let i = this.activeRockets.length - 1; i >= 0; i--) {
            const r = this.activeRockets[i];
            r.pos.add(r.vel); r.vel.y -= 0.02; r.m.position.copy(r.pos);
            if(r.vel.y <= 0.5) {
                this.sc.remove(r.m);
                this.explode(r.pos, r.pal);
                this.activeRockets.splice(i, 1);
            }
        }

        // 2. 更新爆炸 (使用对象池)
        for(let i = 0; i < this.poolSize; i++) {
            const p = this.pool[i];
            if(p.available) continue;

            p.life -= 0.015;
            if(p.life <= 0) {
                p.mesh.visible = false;
                p.available = true; // 归还到池子
                continue;
            }

            const positions = p.mesh.geometry.attributes.position.array;
            const colors = p.mesh.geometry.attributes.color.array;

            for(let k=0; k<this.particlesPerExplosion; k++) {
                const idx = k*3;
                positions[idx] += p.velocities[idx];
                positions[idx+1] += p.velocities[idx+1];
                positions[idx+2] += p.velocities[idx+2];

                p.velocities[idx] *= 0.92;
                p.velocities[idx+1] *= 0.92;
                p.velocities[idx+2] *= 0.92;
                p.velocities[idx+1] -= 0.02;

                // 简单的淡出 (直接修改颜色 buffer)
                if(p.life < 1.0) {
                    colors[idx] *= 0.94; colors[idx+1] *= 0.94; colors[idx+2] *= 0.94;
                }
            }
            p.mesh.geometry.attributes.position.needsUpdate = true;
            p.mesh.geometry.attributes.color.needsUpdate = true;
        }
    }

    explode(pos, pal) {
        const styleIdx = window.getFireworkSoundStyle?.() ?? -1;
        audio.explode(styleIdx);

        // 从池中查找可用对象
        const item = this.pool.find(p => p.available);
        if(!item) return; // 池子满了就忽略，保证性能

        item.available = false;
        item.life = 1.5;
        item.mesh.visible = true;

        const posAttr = item.mesh.geometry.attributes.position.array;
        const colAttr = item.mesh.geometry.attributes.color.array;

        // 重置粒子状态（使用复用颜色对象）
        for(let i=0; i<this.particlesPerExplosion; i++) {
            const idx = i*3;
            // 位置重置为爆炸中心
            posAttr[idx] = pos.x; posAttr[idx+1] = pos.y; posAttr[idx+2] = pos.z;

            // 速度重置
            const speed = 0.5 + Math.random() * 2.8;
            const phi = Math.acos(2 * Math.random() - 1);
            const theta = Math.random() * Math.PI * 2;
            item.velocities[idx] = speed * Math.sin(phi) * Math.cos(theta);
            item.velocities[idx+1] = speed * Math.sin(phi) * Math.sin(theta);
            item.velocities[idx+2] = speed * Math.cos(phi);

            // 颜色重置 - 使用复用颜色对象
            this._tempColor.setHex(pal[Math.floor(Math.random() * pal.length)]);
            this._tempColor.multiplyScalar(1.5);
            colAttr[idx] = this._tempColor.r;
            colAttr[idx+1] = this._tempColor.g;
            colAttr[idx+2] = this._tempColor.b;
        }
        item.mesh.geometry.attributes.position.needsUpdate = true;
        item.mesh.geometry.attributes.color.needsUpdate = true;
    }
}

// ✨ 独立的魔法尾迹系统 (细腻金沙版 - 最终定稿)
class MagicTrail {
    constructor(scene) {
        this.maxParticles = 600; // Reduced from 1200
        this.particles = [];
        this.scene = scene;

        const cv = document.createElement('canvas'); cv.width=32; cv.height=32;
        const cx = cv.getContext('2d'); 
        const g = cx.createRadialGradient(16,16,0,16,16,16);
        g.addColorStop(0, 'rgba(255, 255, 255, 0.9)');   // 核心略白
        g.addColorStop(0.4, 'rgba(255, 210, 80, 0.4)');  // 中间淡金
        g.addColorStop(1, 'rgba(0, 0, 0, 0)');
        cx.fillStyle = g; cx.fillRect(0,0,32,32);
        const tex = new THREE.CanvasTexture(cv);

        this.geo = new THREE.BufferGeometry();
        this.geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(this.maxParticles * 3), 3));
        this.geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(this.maxParticles * 3), 3));
        this.geo.setAttribute('size', new THREE.BufferAttribute(new Float32Array(this.maxParticles), 1));
        this.geo.setAttribute('opacity', new THREE.BufferAttribute(new Float32Array(this.maxParticles), 1));

                this.mat = new THREE.ShaderMaterial({
                    uniforms: { map: { value: tex } },
                    vertexShader: `
                        attribute float size;
                        attribute vec3 color;
                        attribute float opacity;
                        varying vec3 vColor;
                        varying float vOpacity;
                        void main() {
                            vColor = color;
                            vOpacity = opacity;
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            gl_Position = projectionMatrix * mvPosition;
                            // 💡 想要粒子更小？调小这个数字 (当前 550.0)
                            gl_PointSize = size * (550.0 / -mvPosition.z); 
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D map;
                        varying vec3 vColor;
                        varying float vOpacity;
                        void main() {
                            vec4 texColor = texture2D(map, gl_PointCoord);
                            if (texColor.a < 0.05) discard;
                            // NormalBlending 混合，柔和不刺眼
                            gl_FragColor = vec4(vColor, texColor.a * vOpacity); 
                        }
                    `,
                    transparent: true,
                    depthWrite: false,
                    blending: THREE.NormalBlending 
                });
        
                this.mesh = new THREE.Points(this.geo, this.mat);
                this.mesh.frustumCulled = false; 
                
                const posAttr = this.geo.attributes.position;
                for(let i=0; i<this.maxParticles; i++) posAttr.setXYZ(i, 0, -9999, 0);
                
                this.scene.add(this.mesh);
            }
        
            update(dt) {
                const positions = this.geo.attributes.position;
                const opacities = this.geo.attributes.opacity;
                const sizes = this.geo.attributes.size;
                const colors = this.geo.attributes.color;
        
                for(let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.life -= dt;
        
                    if(p.life <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }
        
                    p.pos.addScaledVector(p.vel, dt);
                    p.vel.y -= 6.0 * dt; // 保持下坠感
                    p.vel.multiplyScalar(0.98); 
        
                    const age = p.life / p.maxLife; 
                    p.currOpacity = age * 0.8; // 透明度上限 0.8
                    p.currSize = p.baseSize * (0.6 + 0.4 * age); 
                }
        
                for(let i=0; i<this.maxParticles; i++) {
                    if(i < this.particles.length) {
                        const p = this.particles[i];
                        positions.setXYZ(i, p.pos.x, p.pos.y, p.pos.z);
                        opacities.setX(i, p.currOpacity);
                        sizes.setX(i, p.currSize);
                        // 暗金色，质感更好
                        colors.setXYZ(i, 0.9, 0.7, 0.2); 
                    } else {
                        positions.setXYZ(i, 0, -9999, 0);
                        opacities.setX(i, 0);
                    }
                }
        
                positions.needsUpdate = true;
                opacities.needsUpdate = true;
                sizes.needsUpdate = true;
                colors.needsUpdate = true;
            }
        
            emit(pos, quat, intensity) {
                if (intensity <= 0.05) return;
        
                const count = Math.floor(2 + intensity * 4); 
                const offset = new THREE.Vector3();
                const backDir = new THREE.Vector3(0, 0, 1).applyQuaternion(quat).normalize();
        
                for(let k=0; k<count; k++) {
                    if(this.particles.length >= this.maxParticles) break;
        
                    const side = Math.random() > 0.5 ? 1.8 : -1.8;
                    
                    offset.set(
                        side + (Math.random()-0.5) * 0.2, 
                        0.0, 
                        4.0 + Math.random() * 2.0

    buildTrail() {
        // 🌟 粒子尾迹系统初始化
        this.maxTrailParticles = 1000; // 增加粒子上限
        this.trailParticles = []; 

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(this.maxTrailParticles * 3), 3));
        geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(this.maxTrailParticles * 3), 3));
        geo.setAttribute('size', new THREE.BufferAttribute(new Float32Array(this.maxTrailParticles), 1));

        const cv = document.createElement('canvas'); cv.width=64; cv.height=64;
        const cx = cv.getContext('2d'); 
        const g = cx.createRadialGradient(32,32,0,32,32,32);
        g.addColorStop(0,'rgba(255,255,255,1)');
        g.addColorStop(0.2,'rgba(255,220,100,0.9)');
        g.addColorStop(0.5,'rgba(255,180,50,0.4)');
        g.addColorStop(1,'rgba(0,0,0,0)'); 
        cx.fillStyle=g; cx.fillRect(0,0,64,64);
        const tex = new THREE.CanvasTexture(cv);

        const mat = new THREE.ShaderMaterial({
            uniforms: { map: { value: tex } },
            vertexShader: `
                attribute float size;
                attribute vec3 color;
                varying vec3 vColor;
                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    // 超大尺寸系数，确保远看也清晰
                    gl_PointSize = size * (3000.0 / -mvPosition.z);
                }
            `,
            fragmentShader: `
                uniform sampler2D map;
                varying vec3 vColor;
                void main() {
                    vec4 texColor = texture2D(map, gl_PointCoord);
                    // 增强透明度，防止看不见
                    gl_FragColor = vec4(vColor, 1.0) * texColor * 1.5;
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        this.trail = new THREE.Points(geo, mat);
        this.trail.frustumCulled = false; // 关键修复：防止尾迹因包围盒过期而被剔除
        
        const posAttr = geo.attributes.position;
        for(let i=0; i<this.maxTrailParticles; i++) posAttr.setXYZ(i, 0, -5000, 0);
        
        this.scene.add(this.trail);
    }

    // 发射新粒子 (在飞行时持续调用)
    emitTrail() {
        const count = 8; // 加大发射量
        const offset = new THREE.Vector3();
        
        for(let k=0; k<count; k++) {
            if(this.trailParticles.length >= this.maxTrailParticles) break;

            // 扇形发射源：雪橇尾部
            // 因为之前我们将 group 里的模型转了 180度，但 group 本身的坐标系没变。
            // 我们的模型：头部在局部 -Z，尾部在局部 +Z。
            // 所以尾迹应该在 +Z 方向生成，并向 +Z 方向喷射。
            offset.set(
                (Math.random()-0.5) * 4.0,  // 宽一点
                (Math.random()-0.5) * 2.0 + 2.0, 
                (Math.random()-0.5) * 2.0 + 8.0 // 靠后 (局部+Z)
            ).applyQuaternion(this.group.quaternion); 
            
            const p = {
                pos: this.group.position.clone().add(offset),
                // 粒子初速度：向后喷射 (局部 +Z)
                vel: new THREE.Vector3(0,0,1).applyQuaternion(this.group.quaternion).multiplyScalar(0.8) 
                    .add(new THREE.Vector3(
                        (Math.random()-0.5) * 0.5, 
                        -Math.random() * 0.2, 
                        (Math.random()-0.5) * 0.5
                    )),
                life: 2.0 + Math.random() * 1.5, // 寿命更长
                maxLife: 0, 
                size: 6.0 + Math.random() * 6.0 // 基础尺寸更大
            };
            p.maxLife = p.life;
            this.trailParticles.push(p);
        }
    }

    // 更新所有粒子
    updateTrailParticles(dt) {
        const positions = this.trail.geometry.attributes.position;
        const colors = this.trail.geometry.attributes.color;
        const sizes = this.trail.geometry.attributes.size;

        // 1. 逻辑更新
        for(let i = this.trailParticles.length - 1; i >= 0; i--) {
            const p = this.trailParticles[i];
            p.life -= dt;

            if(p.life <= 0) {
                this.trailParticles.splice(i, 1);
                continue;
            }

            p.pos.add(p.vel);
            p.vel.multiplyScalar(0.97); // 阻力
        }

        // 2. 渲染更新
        for(let i=0; i<this.maxTrailParticles; i++) {
            if(i < this.trailParticles.length) {
                const p = this.trailParticles[i];
                positions.setXYZ(i, p.pos.x, p.pos.y, p.pos.z);
                
                // 颜色与大小随生命周期衰减
                const alpha = Math.pow(p.life / p.maxLife, 1.2); 
                
                // 金色系：R=1.0, G=0.8~0.5, B=0.0
                colors.setXYZ(i, 1.0 * alpha, (0.4 + 0.4 * alpha) * alpha, 0.0); 

                sizes.setX(i, p.size * (0.3 + 0.7 * alpha));
            } else {
                // 隐藏未使用的点
                positions.setXYZ(i, 0, -5000, 0); 
                sizes.setX(i, 0);
            }
        }

        positions.needsUpdate = true;
        colors.needsUpdate = true;
        sizes.needsUpdate = true;
    }



    buildGiftTemplate() {
