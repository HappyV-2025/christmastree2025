    trigger() {
        if (this.active) return;
        if (!train) return; // 需要火车存在

        this.active = true;
        this.phase = 'approach';
        this.phaseTime = 0;
        this.group.visible = true;
        this.trailPositions = [];
        this.giftDropped = false;

        // 记录触发时的火车位置作为目标
        this.targetTrainProg = train.prog;

        // 计算起始位置（天边远处）
        const trainPos = trackCurve.getPointAt(this.targetTrainProg);
        const angle = Math.random() * Math.PI * 2;
        this.startPos = new THREE.Vector3(
            trainPos.x + Math.cos(angle) * 600,
            250 + Math.random() * 100,
            trainPos.z + Math.sin(angle) * 600
        );

        // 计算离开位置（另一个方向的天边）
        const exitAngle = angle + Math.PI + (Math.random() - 0.5) * 0.5;
        this.exitPos = new THREE.Vector3(
            trainPos.x + Math.cos(exitAngle) * 600,
            200 + Math.random() * 100,
            trainPos.z + Math.sin(exitAngle) * 600
        );

        this.group.position.copy(this.startPos);

        // 播放远处铃铛声
        if (audio && audio.bell) {
            audio.bell();
        }
    }

    // 辅助：计算理想悬停位置 (侧前方)
    _getIdealHoverPos(outPos, trainPos, trainTan) {
        // 1. 基础高度
        outPos.copy(trainPos);
        outPos.y += this.hoverHeight;

        // 2. 计算侧向向量 (Right Vector)
        // trainTan 是前进方向, (0,1,0) 是上
        // Cross(Tan, Up) = Right (指向圆心/内侧)
        // 我们要飞在外侧，所以要反向 (-Right)
        const trainRight = this._tempVec.crossVectors(trainTan, this._upVector).normalize();
        
        // 3. 施加偏移
        // 向外侧偏移 18 (负号反转内侧向量)
        outPos.addScaledVector(trainRight, -18.0);
        
        // 向前偏移 15 (沿切线方向)
        outPos.addScaledVector(trainTan, 15.0 * STATE.trainDir);
    }

    update(dt) {
        this.elapsed += dt;

        // 1. 始终更新尾迹系统 (处理残留粒子)
        if (this.trail) this.trail.update(dt);
        
        this.updateFallingGifts(dt);

        if (!this.active && this.elapsed >= this.nextTrigger) {
            this.trigger();
            this.nextTrigger = this.elapsed + 30 + Math.random() * 40; 
        }

        if (!this.active) {
            // 如果不活动，重置上一帧位置，防止下次出现时速度计算错误
            if (this._lastPos) this._lastPos.copy(this.group.position);
            return;
        }

        // 初始化上一帧位置
        if (!this._lastPos) this._lastPos = this.group.position.clone();

        // 2. 计算物理速度 (用于控制尾迹强度)
        const dist = this.group.position.distanceTo(this._lastPos);
        const currentSpeed = dist / dt; // 单位/秒
        
        // 更新上一帧位置
        this._lastPos.copy(this.group.position);

        // 3. 基于速度的喷射强度
        const emissionIntensity = Math.min(currentSpeed / 30.0, 1.0);

        // 发射尾迹
        if (this.trail) {
            this.trail.emit(this.group.position, this.group.quaternion, emissionIntensity);
        }

        this.phaseTime += dt;

        // --- 核心飞行逻辑 ---
        // 获取火车当前状态
        const trainPos = train ? trackCurve.getPointAt(train.prog) : new THREE.Vector3();
        const trainTan = train ? trackCurve.getTangentAt(train.prog) : new THREE.Vector3(0, 0, 1); 
        
        // 预计算理想伴飞点 (Target Hover Position)
        const idealHoverPos = new THREE.Vector3();
        this._getIdealHoverPos(idealHoverPos, trainPos, trainTan);

        // 计算看向点 (Look Ahead)
        this._lookPos.copy(trainTan).multiplyScalar(STATE.trainDir); 
        
        let updateLook = false;

        switch (this.phase) {
            case 'approach': {
                const t = Math.min(this.phaseTime / this.approachDur, 1);
                const easeT = 1 - Math.pow(1 - t, 3); 

                // 目标：直接飞向理想伴飞点 (不再是飞向头顶)
                this._targetPos.copy(this.startPos).lerp(idealHoverPos, easeT);
                
                // 抛物线高度补偿
                this._targetPos.y += Math.sin(t * Math.PI) * 20; 

                this._lookPos.copy(idealHoverPos);
                updateLook = true;

                if (t >= 1) {
                    this.phase = 'sync';
                    this.phaseTime = 0;
                }
                break;
            }

            case 'sync': {
                const t = this.phaseTime / this.syncDur;

                // 目标：紧贴理想伴飞点
                this._targetPos.copy(idealHoverPos);
                
                // 叠加呼吸浮动
                this._targetPos.y += Math.sin(this.elapsed * 2) * 1.5;

                // 视线：看向前方远处
                const tDir = trainTan.clone().multiplyScalar(STATE.trainDir);
                this._lookPos.copy(this._targetPos).addScaledVector(tDir, 20);
                updateLook = true;

                if (t >= 0.5 && !this.giftDropped) {
                    if (!this._sleighWorldPos) this._sleighWorldPos = new THREE.Vector3();
                    this._sleighWorldPos.set(0, 1, 0); 
                    this._sleighWorldPos.applyMatrix4(this.group.matrixWorld);

                    this.dropGift(this._sleighWorldPos);
                    this.giftDropped = true;
                }

                if (t >= 1) {
                    this.phase = 'depart';
                    this.phaseTime = 0;
                    if(!this.departStart) this.departStart = new THREE.Vector3();
                    this.departStart.copy(this._targetPos);
                }
                break;
            }

            case 'depart': {
                const t = Math.min(this.phaseTime / this.departDur, 1);
                const easeT = t * t; 

                this._targetPos.copy(this.departStart).lerp(this.exitPos, easeT);
                this._targetPos.y += Math.sin(t * Math.PI) * 30; 

                this._lookPos.copy(this.exitPos);
                updateLook = true;

                if (t >= 1) {
                    this.active = false;
                    this.group.visible = false;
                    this.phase = 'idle';
                }
                break;
            }
        }

        if (this.active) {
            this.group.position.lerp(this._targetPos, 0.1);

            if (updateLook) {
                this._lookDir.copy(this._lookPos).sub(this.group.position).normalize();
                if (this._lookDir.length() > 0.01) {
                    this._lookMatrix.lookAt(this.group.position, this._lookPos, this._upVector);
                    this._targetQuat.setFromRotationMatrix(this._lookMatrix);
                    this.group.quaternion.slerp(this._targetQuat, 0.05);
                }
            }

            this.group.position.y += Math.sin(this.elapsed * 3) * 0.5;

            if (this.reindeer) {
                this.reindeer.children.forEach((deer, i) => {
                    if (deer.type === 'Group') {
                        deer.rotation.x = Math.sin(this.elapsed * 8 + i) * 0.15;
                    }
                });
            }
        }
    }

    dropGift(fromPos) {
        if (!train || train.cars.length === 0) return;

        // 1. 决定扔几个 (狂欢模式扔更多: 6-10个)
        const dropCount = STATE.christmasParty ? 6 + Math.floor(Math.random() * 5) : 1;

        // 复制数组以确保从不同车厢选择 (洗牌算法简化版)
        const candidates = [...train.cars];
        const startPosFixed = fromPos.clone(); // 锁定起始位置，防止因延时导致位置漂移

        for (let i = 0; i < dropCount; i++) {
            if (candidates.length === 0) break;

            const idx = Math.floor(Math.random() * candidates.length);
            const targetCar = candidates.splice(idx, 1)[0];

            // 错峰发射，形成连珠炮效果
            // 修复竞态条件：在执行时验证targetCar仍然在场景中
            setTimeout(() => {
                // 验证targetCar仍然存在于火车车厢中
                if (train && train.cars && train.cars.includes(targetCar)) {
                    this.spawnSingleGift(startPosFixed, targetCar);
                }
            }, i * 100); // 更快的连射
        }
    }

    spawnSingleGift(startPos, targetCar) {
        const gift = this.createGift();
        gift.position.copy(startPos);
        gift.scale.set(0.8, 0.8, 0.8);
        this.scene.add(gift);

        // --- 💡 优化2：初始化发光材质 ---
        // 遍历礼物的所有部分，开启自发光
        gift.traverse(c => {
            if (c.isMesh && c.material) {
                // 确保开启发光特性
                c.material.emissive = new THREE.Color(c.material.color);
                c.material.emissiveIntensity = 0.5; // 初始亮度
            }
        });

        this.scene.add(gift);

        if (audio && audio.throwSound) audio.throwSound();

        // 为礼物创建飞行尾迹
        const trailColor = gift.children[0].material.color.getHex(); // 获取礼盒主体颜色
        const trail = new GiftParticleTrail(this.scene, trailColor);

        this.fallingGifts.push({
            mesh: gift,
            startPos: startPos, 
            targetCar: targetCar,      
            time: 0,                   
            duration: 2.5,             
            arcHeight: 12,             
            landed: false,
            
            // --- 💡 优化3：Q弹动画变量 ---
            scaleTime: 0,        // 用于落地后的形变动画计时
            isSquashing: false,  // 是否正在进行落地变形
            baseScale: 0.8,      // 基础缩放比例
            
            rotVel: new THREE.Vector3( 
                Math.random() - 0.5,
                Math.random() - 0.5,
                Math.random() - 0.5
            ).multiplyScalar(3.0), // 稍微加快旋转速度，更有动感    
            
            trail: trail, 
            fadeStartTime: 0, 
            fadeDuration: 0.1 // 极快淡出
        });
    }

    updateFallingGifts(dt) {
        for (let i = this.fallingGifts.length - 1; i >= 0; i--) {
            const g = this.fallingGifts[i];

            if (g.landed) {
                this._handleLandedGift(g, i, dt);
            } else {
                this._handleFlyingGift(g, i, dt);
            }
        }
    }

    _handleLandedGift(g, index, dt) {
        // 1. 处理 Q 弹动画 (Squash & Stretch) - 仅在刚落地时有效
        if (g.isSquashing) {
            g.scaleTime += dt * 15.0;
            const decay = Math.exp(-g.scaleTime * 0.5);
            const wave = Math.sin(g.scaleTime) * 0.4 * decay;

            const sy = g.baseScale * (1.0 - wave);
            const sxz = g.baseScale * (1.0 + wave * 0.5);
            g.mesh.scale.set(sxz, sy, sxz);

            if (g.scaleTime > Math.PI * 2) {
                g.isSquashing = false;
                g.mesh.scale.set(g.baseScale, g.baseScale, g.baseScale);
            }
        }

        // 2. 生命周期管理 (吸收效果)
        g.life -= dt;

        // --- 📥 吸收倒计时 (最后 1.5 秒) ---
        if (g.life < 1.5) {
            const progress = Math.max(0, g.life / 1.5); // 1.0 -> 0.0

            // A. 缓慢下沉 (Sink)
            // 假设初始 Y 是 5.5 (车顶)，我们要让它沉到 3.5 (车身内)
            // 这里的 Y 是相对于 g.targetCar 的局部坐标
            // 我们不需要保存初始 Y，只需要每帧稍微减一点，或者插值
            g.mesh.position.y -= dt * 1.5;

            // B. 缩小 (Shrink)
            const scale = g.baseScale * progress;
            g.mesh.scale.set(scale, scale, scale);

            // C. 亮度爆发 (转化能量)
            const flare = 0.5 + 2.0 * (1.0 - progress);
            g.mesh.traverse(c => {
                if (c.isMesh && c.material.emissive) {
                    c.material.emissiveIntensity = flare;
                }
            });
        }
        // --- 正常停留期 ---
        else if (!g.isSquashing) {
            const pulse = 0.4 + 0.2 * Math.sin(this.elapsed * 3.0 + g.mesh.id);
            g.mesh.traverse(c => {
                if (c.isMesh) c.material.emissiveIntensity = pulse;
            });
        }

        // 3. 彻底吸收完成
        if(g.life <= 0) {
            this._handleGiftAbsorption(g, index);
            return;
        }

        // 4. 尾迹清理
        if (g.trail) {
            g.trail.dispose();
            g.trail = null;
        }
    }

    _handleFlyingGift(g, index, dt) {
        g.time += dt;
        let t = Math.min(g.time / g.duration, 1.0);

        // --- 🔧 新版抛物线逻辑 (Quadratic Bezier) ---
        // 目标位置：车厢当前位置
        // 修复竞态条件：验证targetCar存在后再访问
        if (!g.targetCar || !(train && train.cars && train.cars.includes(g.targetCar))) {
            // 如果targetCar已不存在，则移除该礼物
            if(g.mesh.parent) g.mesh.parent.remove(g.mesh);
            if (g.trail) g.trail.dispose();
            this.fallingGifts.splice(index, 1);
            return;
        }

        const _targetWorldPos = new THREE.Vector3();
        const _midPoint = new THREE.Vector3();

        g.targetCar.getWorldPosition(_targetWorldPos);
        // 目标高度调整：车顶最高点 (Local Y ~7.25) + 礼物半高
        // 这样飞行轨迹也是瞄准车顶的
        const carUp = new THREE.Vector3(0, 1, 0).applyQuaternion(g.targetCar.quaternion);
        _targetWorldPos.addScaledVector(carUp, 8.0);

        // 控制点计算：起点和终点的中点，再向上抬高
        _midPoint.copy(g.startPos).add(_targetWorldPos).multiplyScalar(0.5);
        _midPoint.y += 40; // 抬高控制点，形成拱门

        // 贝塞尔公式: (1-t)^2 * P0 + 2(1-t)t * P1 + t^2 * P2
        const p0 = g.startPos;
        const p1 = _midPoint;
        const p2 = _targetWorldPos;

        const t1 = 1 - t;
        g.mesh.position.x = t1*t1 * p0.x + 2*t1*t * p1.x + t*t * p2.x;
        g.mesh.position.y = t1*t1 * p0.y + 2*t1*t * p1.y + t*t * p2.y;
        g.mesh.position.z = t1*t1 * p0.z + 2*t1*t * p1.z + t*t * p2.z;

        // 更新旋转
        g.mesh.rotation.x += g.rotVel.x * dt;
        g.mesh.rotation.y += g.rotVel.y * dt;
        g.mesh.rotation.z += g.rotVel.z * dt;

        // 呼吸光效
        const pulse = 0.65 + 0.35 * Math.sin(g.time * 5.0);
        g.mesh.traverse(c => {
            if (c.isMesh) c.material.emissiveIntensity = pulse;
        });

        // 更新尾迹
        if (g.trail) g.trail.update(g.mesh.position);

        // ===========================
        // 💥 状态 C: 刚接触瞬间 (Impact)
        // ===========================
        if (t >= 1.0) {
            this._handleGiftImpact(g, index);
        }
    }

    _handleGiftImpact(g, index) {
        // 验证targetCar仍然存在
        if (!g.targetCar || !(train && train.cars && train.cars.includes(g.targetCar))) {
            // 如果targetCar已不存在，则移除该礼物
            if(g.mesh.parent) g.mesh.parent.remove(g.mesh);
            if (g.trail) g.trail.dispose();
            this.fallingGifts.splice(index, 1);
            return;
        }

        // 标记为已落地
        g.landed = true;

        // 设置跟随：把礼物加到车厢对象里
        if (g.mesh.parent) g.mesh.parent.remove(g.mesh);
        g.targetCar.add(g.mesh);

        // --- 🔧 修正落地位置 (Snap to Curved Roof) ---
        // 车顶参数: 轴心Y=5.2, 半径R=2.05
        const roofAxisY = 5.2;
        const roofRadius = 2.05;

        // 随机 X (宽度方向)
        // 限制在 [-1.6, 1.6] 范围内，避免掉出边缘
        const rX = (Math.random() - 0.5) * 3.2;

        // 计算对应的圆柱面高度 Y
        // y = axisY + sqrt(R^2 - x^2)
        // 防止浮点误差导致 NaN
        const h = Math.sqrt(Math.max(0, roofRadius*roofRadius - rX*rX));
        const surfaceY = roofAxisY + h;

        // 随机 Z (长度方向)
        const rZ = (Math.random() - 0.5) * 6.0;

        // 设置位置 (加一点偏移防止穿模，假设礼物半高约 0.8)
        g.mesh.position.set(rX, surfaceY + 0.6, rZ);

        // 计算法线角度，让礼物稍微贴合曲面倾斜
        // 法线向量在 XY 平面是 (rX, h)，角度是 atan2(rX, h)
        const normalAngle = Math.atan2(rX, h);

        // 落地姿态：围绕法线稍微随机旋转
        g.mesh.rotation.set(0, 0, -normalAngle); // 基础倾斜
        g.mesh.rotateY(Math.random() * Math.PI * 2); // 随机朝向
        g.mesh.rotateX((Math.random() - 0.5) * 0.5); // 随机微调

        // 设置消失倒计时
        g.life = 4.0;
        g.fadeStartTime = this.elapsed;
        g.isSquashing = true;
        g.scaleTime = 0;

        // --- 💥 增强落地特效 ---
        if (window.fwMgr) {
            const worldPos = new THREE.Vector3();
            g.mesh.getWorldPosition(worldPos);
            // 颜色：金色 + 红色 + 雪白
            const landingPalette = [0xffd700, 0xff0000, 0xffffff];
            window.fwMgr.explode(worldPos, landingPalette);

            // 音效
            if(audio) audio.explode(4);
        }
    }

    _handleGiftAbsorption(g, index) {
        // --- 🚃 车厢反馈 (Absorb Reaction) ---
        // 触发车厢窗户闪烁，表示收到礼物
        if (train && train.flashWindows && g.targetCar) {
            // 验证targetCar仍然存在于火车车厢中
            if (train.cars && train.cars.includes(g.targetCar)) {
                train.flashWindows(g.targetCar);
            }
            // 播放一个小音效 (收集声)
            if (audio && audio.collectSound) audio.collectSound();
        }

        // 移除物体
        if(g.mesh.parent) g.mesh.parent.remove(g.mesh);

        // 深度清理内存
        g.mesh.traverse(c => {
            if (c.isMesh) {
                if (c.geometry) c.geometry.dispose();
                if (c.material) {
                    if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
                    else c.material.dispose();
                }
            }
        });
        this.fallingGifts.splice(index, 1);
    }

    updateTrail(currentPos) {
        // 添加新位置到尾迹（带固定的随机偏移，只在添加时计算一次）
        const trailPoint = currentPos.clone();
        trailPoint.x += (Math.random() - 0.5) * 6;
        trailPoint.y += (Math.random() - 0.5) * 3;
        trailPoint.z += (Math.random() - 0.5) * 6;
        this.trailPositions.unshift(trailPoint);

        // 限制尾迹长度
        if (this.trailPositions.length > 100) {
            this.trailPositions.pop();
        }

        // 更新粒子位置（不再每帧随机，使用已存储的位置）
        const positions = this.trail.geometry.attributes.position.array;
        for (let i = 0; i < 100; i++) {
            if (i < this.trailPositions.length) {
                const p = this.trailPositions[i];
                positions[i * 3] = p.x;
                positions[i * 3 + 1] = p.y;
                positions[i * 3 + 2] = p.z;
            } else {
                // 未使用的粒子移到很远
                positions[i * 3] = 0;
                positions[i * 3 + 1] = -1000;
                positions[i * 3 + 2] = 0;
            }
        }
        this.trail.geometry.attributes.position.needsUpdate = true;

        // 尾迹透明度随时间衰减
        this.trail.material.opacity = this.active ? 0.8 : 0;
    }
}

class Snow {
    constructor(sc) {
        const count = 3000; // Reduced from 6000 for mobile performance
        const pos = [];
        const velocities = []; // 存储下落速度和偏移
        
        for(let i=0; i<count; i++) {
            pos.push(
                (Math.random() * 2 - 1) * 400,
                Math.random() * 600,
                (Math.random() * 2 - 1) * 400
            );
            // x: 下落速度, y: 摇摆频率, z: 摇摆幅度
            velocities.push(
                25 + Math.random() * 20, 
                0.5 + Math.random(), 
                5 + Math.random() * 10 
            );
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute('velocity', new THREE.Float32BufferAttribute(velocities, 3));

        // 简单的雪花纹理
        const cv = document.createElement('canvas'); cv.width=32; cv.height=32;
        const cx = cv.getContext('2d'); cx.fillStyle='#fff'; cx.beginPath(); cx.arc(16,16,16,0,Math.PI*2); cx.fill();
        const tex = new THREE.CanvasTexture(cv);

        // 自定义 Shader 材质
        const mat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uTex: { value: tex },
                uHeight: { value: 600.0 } // 边界高度
            },
            vertexShader: `
                uniform float uTime;
                uniform float uHeight;
                attribute vec3 velocity;
                varying float vAlpha;
                void main() {
                    vec3 pos = position;
                    // Y轴下落计算：(初始Y - 速度*时间) 对 高度取模
                    float fallOffset = velocity.x * uTime;
                    pos.y = mod(position.y - fallOffset, uHeight);
                    
                    // X轴摇摆
                    pos.x += sin(uTime * velocity.y + position.y * 0.05) * velocity.z;
                    
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    
                    // 距离衰减 (可选)
                    gl_PointSize = (300.0 / -mvPosition.z) * 0.8;
                    vAlpha = 0.8;
                }
            `,
            fragmentShader: `
                uniform sampler2D uTex;
                varying float vAlpha;
                void main() {
                    vec4 color = texture2D(uTex, gl_PointCoord);
                    if (color.a < 0.5) discard;
                    gl_FragColor = vec4(1.0, 1.0, 1.0, vAlpha * color.a);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        this.m = new THREE.Points(geo, mat);
        sc.add(this.m);
    }
    
    update(dt) {
        // CPU 只需要更新一个时间变量
        this.m.material.uniforms.uTime.value += dt;
    }
}

let isXmasMode = false;
let backupCFG = {};

function setupUI() {
    const btn = document.getElementById('start-btn');

    // 批量发射烟花（提前定义，供下方回调使用）
    btn.onclick = () => {
        try {
            STATE.started = true;
            STATE.running = true;
            STATE.viewMode = VIEW_MODES.INTRO; // 🚫 关键修复：暂时屏蔽主循环的相机控制，防止抖动
            
            // Audio Init can fail if user didn't interact (but this is a click handler, so it's fine)
            audio.init(); 
            audio.warmup(); // 🌟 预热音频，防止后续卡顿
            audio.whistle(); 
            audio.playBGM(); 
            
            // 自动燃放的启动逻辑（延迟等待降落动画完成）
            if (CFG.autoFw) {
                setTimeout(() => {
                    if (!STATE.started) return; // 防止用户快速关闭
                    launchBatch(); 
                    autoTimer = setInterval(launchBatch, CFG.fwRate * 1000);
                }, 2500); // 延迟2.5秒，等降落动画完成
            }

            document.getElementById('start-screen').style.opacity = 0;
            setTimeout(() => document.getElementById('start-screen').style.display = 'none', 800);
            document.getElementById('hud').style.opacity = 1;
            document.getElementById('settings-btn').style.opacity = 1;
            document.getElementById('firework-btn').style.opacity = 1;
            document.getElementById('countdown-wrap').style.opacity = 1;

            // 首次展示圣诞倒计时
            if (window.showCountdownFirstTime) window.showCountdownFirstTime();

            // 🚁 启动运镜：无人机从侧面高空降落
            // 初始化当前无人机为第一个（或根据火车位置选择最近的）
            CameraDirector.state.currentDrone = Math.floor(train.prog * CameraDirector.config.droneCount) % CameraDirector.config.droneCount;

            // 计算目标跟拍位置
            const endPos = new THREE.Vector3();
            const endTarget = new THREE.Vector3();
            CameraDirector.getDronePosition(CameraDirector.state.currentDrone, train.prog, endPos, endTarget);

            // 起始位置：目标位置的正上方 + 侧向偏移（模拟无人机从侧面高空飞来）
            const startPos = endPos.clone();
            startPos.y += 120; // 从高空开始
            startPos.x += 60;  // 侧向偏移
            startPos.z += 40;

            // 起始看向点：场景中心（俯瞰全景）
            const startTarget = new THREE.Vector3(0, 0, 0);

            // 设置初始相机位置
            camera.position.copy(startPos);
            camera.lookAt(startTarget);
            controls.target.copy(startTarget);

            let t = 0;
            const iv = setInterval(() => {
                t += 0.012; // 稍慢一点，更有电影感

                if (t >= 1) {
                    clearInterval(iv);
                    STATE.viewMode = VIEW_MODES.FOLLOW; // ✅ 动画结束，无缝切换回智能跟拍模式
                    // 确保最终位置精确
                    camera.position.copy(endPos);
                    controls.target.copy(endTarget);
                } else {
                    // 使用 ease-out 曲线，开始快结束慢（像无人机减速降落）
                    const k = 1 - Math.pow(1 - t, 3);

                    // 更新目标位置（火车在移动）
                    CameraDirector.getDronePosition(CameraDirector.state.currentDrone, train.prog, endPos, endTarget);

                    // 插值相机位置
                    camera.position.lerpVectors(startPos, endPos, k);

                    // 插值看向点（从全景过渡到跟踪火车）
                    const lookTarget = new THREE.Vector3();
                    lookTarget.lerpVectors(startTarget, endTarget, k);
                    camera.lookAt(lookTarget);
                    controls.target.copy(lookTarget);
                }
            }, 16);
        } catch(e) {
            console.error("Start Error:", e);
            alert("启动时发生错误，请刷新重试: " + e.message);
        }
    };

    // UI数据绑定系统
    const UIDataBinder = {
      bindRange: (id, targetObj, key, displayId, callback) => {
        const el = document.getElementById(id);
        if (!el) return; // safety
        const disp = document.getElementById(displayId);
        el.value = targetObj[key]; // init
        if(disp) disp.innerText = targetObj[key];

        el.oninput = (e) => {
            const v = parseFloat(e.target.value);
            targetObj[key] = v;
            if(disp) disp.innerText = v;
            if(callback) callback(v);
        };
      },

      bindCheckbox: (id, targetObj, key, callback) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.checked = targetObj[key] || false;

        el.onchange = (e) => {
          targetObj[key] = e.target.checked;
          if (callback) callback(e.target.checked);
        };
      },

      bindSelect: (id, targetObj, key, callback) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.value = targetObj[key] || '';

        el.onchange = (e) => {
          targetObj[key] = e.target.value;
          if (callback) callback(e.target.value);
        };
      },

      batchBind: (bindings) => {
        bindings.forEach(binding => {
          const { type, id, targetObj, key, displayId, callback } = binding;
          switch (type) {
            case 'range':
              this.bindRange(id, targetObj, key, displayId, callback);
              break;
            case 'checkbox':
              this.bindCheckbox(id, targetObj, key, callback);
              break;
            case 'select':
              this.bindSelect(id, targetObj, key, callback);
              break;
          }
        });
      }
    };

    const fwBtn = document.getElementById('firework-btn');
    fwBtn.onclick = () => {

    const trainToggle = document.getElementById('train-toggle');
    const hudStatus = document.getElementById('hud-status');
    const dot = document.getElementById('d-status');

    const updateTrainUI = () => {
        trainToggle.textContent = STATE.running ? '⏸️' : '▶️';
        dot.classList.toggle('stop', !STATE.running);
    };

    trainToggle.onclick = () => {
        if (!STATE.started) return;
        STATE.running = !STATE.running;
        if (STATE.running) {
            audio.whistle();
        }
        updateTrainUI();
    };

    // ===== 🚁 模式切换（点击HUD状态文字） =====
    hudStatus.onclick = () => {
        if (!STATE.started) return;

        if (STATE.viewMode === VIEW_MODES.FOLLOW) {
            // 切换到自由探索
            STATE.viewMode = VIEW_MODES.FREE;
            hudStatus.textContent = '自由探索模式';
            dot.style.background = '#4fc3f7';
            dot.style.boxShadow = '0 0 8px #4fc3f7';
        } else {
            // 切换回智能驾驶：平滑过渡到正确的无人机位置
            hudStatus.textContent = '智能驾驶模式';
            dot.style.background = STATE.running ? '#00ff00' : '#ff3300';
            dot.style.boxShadow = STATE.running ? '0 0 8px #00ff00' : '0 0 8px #ff3300';

            CameraDirector.startCruise();
        }
    };

    // ===== 🖱️ 场景点击交互 =====
    const cvs = document.getElementById('canvas-container');
    cvs.addEventListener('pointerdown', () => STATE.clickTime = Date.now());
    cvs.addEventListener('pointerup', (e) => {
        if (Date.now() - STATE.clickTime < 200 && STATE.started && !STATE.settings && train && camera) {
            mouse.x = (e.clientX / innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / innerHeight) * 2 + 1;
            ray.setFromCamera(mouse, camera);

            if (train.grp && train.grp.children) {
                const hitTrain = ray.intersectObjects(train.grp.children, true);
                if (hitTrain.length > 0) {
                    const hitObj = hitTrain[0].object;

                    // 判断是否点击的是火车头
                    let isLoco = false;
                    if (train.loco) {
                        hitObj.traverseAncestors(p => { if (p === train.loco) isLoco = true; });
                    }

                    if (isLoco) {
                        // 🎵 点击火车头 → BGM 开/关
                        if (audio.isBgmPlaying) {
                            audio.stopBGM();
                        } else {
                            audio.playBGM();
                        }
                    } else {
                        // 🔔 点击车厢 → 窗户闪烁 + 扔礼盒 + 铃铛响
                        // 找到被点击的车厢
                        let clickedCar = null;
                        if (train.cars) {
                            hitObj.traverseAncestors(p => {
                                if (train.cars.includes(p)) clickedCar = p;
                            });
                        }

                        if (clickedCar) {
                            // 尝试扔礼盒（有冷却限制）
                            if (train && train.throwGift && train.flashWindows) {
                                if (train.throwGift(clickedCar)) {
                                    train.flashWindows(clickedCar);
                                    if(audio && audio.throwSound) audio.throwSound();
                                }
                            }
                        } else {
                            audio.bell();
                        }
                    }
                    return;
                }
            }

            // 🎁 检查是否点击了大礼盒
            const megaGiftExists = typeof MegaGiftManager !== 'undefined' && MegaGiftManager !== null;
            console.log("Gift Click Check:", {
                giftPhase: STATE.giftPhase,
                expectedPhase: GIFT_PHASES.WAITING,
                megaGiftManagerExists: megaGiftExists,
                megaGiftMeshExists: megaGiftExists && MegaGiftManager.mesh ? !!MegaGiftManager.mesh : false,
                isWaiting: STATE.giftPhase === GIFT_PHASES.WAITING
            });

            if (STATE.giftPhase === GIFT_PHASES.WAITING && megaGiftExists && MegaGiftManager.mesh) {
                const hitGift = ray.intersectObject(MegaGiftManager.mesh, true);
                console.log("Gift Raycast Result:", { hitCount: hitGift.length, hitGift });
                if (hitGift.length > 0) {
                    console.log("Opening Mega Gift!");
                    MegaGiftManager.open();
                    return;
                } else {
                    console.log("Raycast missed the gift");
                }
            } else {
                console.log("Gift click conditions not met");
            }

            // 点击空地：无反应（已移除手动烟花）
        }
    });

    // ===== 🎄 10-Hour Celebration Countdown (Hybrid Mode) =====
    const countdownTrigger = document.getElementById('countdown-trigger');
    const countdownPanel = document.getElementById('countdown-panel');
    const countdownDetail = document.getElementById('countdown-detail');
    const countdownDays = document.getElementById('countdown-days');
    const finalEl = document.getElementById('final-countdown');
    
    // Config
    const COUNTDOWN_HOURS = 10;
    
    let targetTime = null;
    let lastRenderedSec = -1;
    let countdownExpanded = true;
    let countdownTimer = null;
    let isCounting = false;
    let isManualDebug = false; // 标记是否处于手动调试模式

    // 1. 初始化倒计时 (Hybrid: 真实日期 or 调试偏移)
    const initCelebrationCountdown = (offsetSeconds = null) => {
        const now = Date.now();
        
        if (offsetSeconds !== null) {
            // A. 调试模式 / 强制设定
            targetTime = now + offsetSeconds * 1000;
            isManualDebug = true;
        } else {
            // B. 真实日历模式 (下一个 12月25日)
            const date = new Date();
            let year = date.getFullYear();
            let xmas = new Date(year, 11, 25, 0, 0, 0);
            // 如果今年已经过了 (比如12月26日)，则算明年
            if (date > xmas) xmas = new Date(year + 1, 11, 25, 0, 0, 0);
            targetTime = xmas.getTime();
            isManualDebug = false;
        }

        isCounting = true;
        
        // 重置 UI 基础可见性
        countdownTrigger.style.display = 'flex';
        countdownTrigger.style.opacity = '1';
        countdownPanel.style.opacity = '1';
        countdownPanel.style.pointerEvents = 'auto';
        finalEl.style.display = 'none';
        
        // 强制展开面板 (仅首次或调试时)
        if(!countdownExpanded) toggleCountdown(true);
        
        // 立即刷新
        updateCountdown();
    };

    // 2. 核心逻辑封装 (Pure Functions)
    const getCountdownPhase = (totalSeconds) => {
        if (totalSeconds <= 0) return 'FINISHED';
        if (totalSeconds <= 60) return 'SPRINT';      // 冲刺 (≤60s)
        if (totalSeconds < 3600) return 'MINUTES';    // 庆典分钟 (<1h) *修正：1小时整归入HOURS
        if (totalSeconds <= 36000) return 'HOURS';    // 庆典小时 (≤10h)
        if (totalSeconds < 86400) return 'DAY';       // 近期 (<24h) *修正：24小时整归入LONG_TERM
        return 'LONG_TERM';                           // 远期 (≥24h)
    };

    const formatCountdownText = (totalSeconds) => {
        const phase = getCountdownPhase(totalSeconds);
        const days = Math.floor(totalSeconds / (3600 * 24));
        const h = Math.floor((totalSeconds % (3600 * 24)) / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = totalSeconds % 60;
        const pad = n => n.toString().padStart(2, '0');

        let data = {
            phase: phase,
            triggerText: '圣诞',
            panelText: '',
            centerText: '',
            daysVisible: true,
            daysValue: days
        };

        switch (phase) {
            case 'LONG_TERM':
                data.triggerText = '圣诞';
                data.daysVisible = true;
                // 使用 Flex 布局强制单行，并允许微调间距
                data.panelText = `
                    <div style="display:flex; justify-content:center; align-items:baseline; gap:6px; white-space:nowrap; width:100%;">
                        <span style="font-size:0.85em">${days}天</span>
                        <span>${pad(h)}时${pad(m)}分${pad(s)}秒</span>
                    </div>
                `;
                break;
            case 'DAY': // < 24h
                data.triggerText = '圣诞';
                data.daysVisible = true;
                data.panelText = `
                    <div style="display:flex; justify-content:center; align-items:baseline; gap:6px; white-space:nowrap; width:100%;">
                        <span>${pad(h)}时${pad(m)}分${pad(s)}秒</span>
                    </div>
                `;
                break;
            case 'HOURS': // < 10h (Celebration Start)
                data.triggerText = '庆典';
                data.daysVisible = false;
                data.panelText = `
                    <div style="display:flex; justify-content:center; align-items:baseline; gap:6px; white-space:nowrap; width:100%;">
                        <span>${pad(h)}时${pad(m)}分${pad(s)}秒</span>
                    </div>
                `;
                break;
            case 'MINUTES': // < 1h
                data.triggerText = '庆典';
                data.daysVisible = false;
                // 字体放大，强调分秒，Flex强制单行
                data.psanelText = `
                    <div style="display:flex; justify-content:center; align-items:baseline; gap:6px; white-space:nowrap; width:100%;">
                        <span style="font-size:1.2em; color:#ffd700; font-weight:bold;">${pad(m)}分${pad(s)}秒</span>
                    </div>
                `;
                break;
            case 'SPRINT': // < 60s
                data.triggerText = ''; // 隐藏
                data.daysVisible = false;
                data.panelText = '';   // 隐藏
                // 核心修复：直接显示总秒数 (60, 59, ... 1)
                data.centerText = totalSeconds.toString(); 
                break;
        }
        return data;
    };

    // 3. UI 更新循环
    const updateCountdown = () => {
        if (!isCounting || !targetTime || STATE.christmasParty) return;

        const now = Date.now();
        const diff = Math.max(0, targetTime - now);
        const totalSeconds = Math.ceil(diff / 1000);

        // 获取格式化数据
        const data = formatCountdownText(totalSeconds);

        // 处理结束状态
        if (data.phase === 'FINISHED') {
            handleCountdownFinish();
            return;
        }

        // 性能优化：秒数没变就不重绘
        if (totalSeconds === lastRenderedSec) return;
        lastRenderedSec = totalSeconds;

        // --- 应用 UI 状态 ---

        // 1. 右上角 Trigger (小胶囊)
        if (data.phase === 'SPRINT') {
            countdownTrigger.style.opacity = '0';
            countdownTrigger.style.pointerEvents = 'none';
        } else {
            countdownTrigger.style.opacity = '1';
            countdownTrigger.style.pointerEvents = 'auto';
            const trigText = countdownTrigger.querySelector('.text');
            if(trigText) trigText.innerText = data.triggerText;
            
            const daysWrap = document.getElementById('countdown-days-wrap');
            if(daysWrap) {
                daysWrap.style.display = data.daysVisible ? 'inline' : 'none';
                if(countdownDays) countdownDays.innerText = data.daysValue;
            }
        }

        // 2. 右上角 Panel (展开详情)
        if (data.phase === 'SPRINT') {
            countdownPanel.style.opacity = '0';
            countdownPanel.style.pointerEvents = 'none';
        } else {
            countdownPanel.style.opacity = '1';
            countdownPanel.style.pointerEvents = 'auto';
            if (countdownDetail) countdownDetail.innerHTML = data.panelText;
            
            // 特殊动效：整点/整分闪烁
            const s = totalSeconds % 60;
            if (s === 0 && (data.phase === 'HOURS' || data.phase === 'MINUTES')) {
                triggerPanelPulse();
            }
        }

        // 3. 屏幕中央 (Sprint)
        if (data.phase === 'SPRINT') {
            finalEl.style.display = 'block';
            finalEl.innerText = data.centerText;

            // 终极冲刺逻辑 (< 10s)
            if (totalSeconds <= 10) {
                finalEl.style.fontSize = '250px';
                finalEl.style.color = (totalSeconds % 2 === 0) ? '#ff3300' : '#ffd700';
                finalEl.style.textShadow = '0 0 50px rgba(255, 0, 0, 0.8)';
                
                finalEl.classList.remove('pop');
                void finalEl.offsetWidth; 
                finalEl.classList.add('pop');
                
                if(audio && audio.bell) audio.bell(); // 滴答声
            } 
            else {
                // 60s ~ 11s
                finalEl.style.fontSize = '120px';
                finalEl.style.color = '#ffffff';
                finalEl.style.textShadow = '0 0 20px rgba(79, 195, 247, 0.6)';
                // 呼吸
                const scale = 1.0 + Math.sin(now * 0.005) * 0.05;
                finalEl.style.transform = `translateX(-50%) scale(${scale})`;
            }
        } else {
            finalEl.style.display = 'none';
        }
    };

    const triggerPanelPulse = () => {
        countdownPanel.style.transform = 'scale(1.1)';
        countdownPanel.style.borderColor = '#fff';
        setTimeout(() => {
            countdownPanel.style.transform = 'scale(1)';
            countdownPanel.style.borderColor = 'rgba(255, 215, 0, 0.4)';
        }, 300);
    };

    const handleCountdownFinish = () => {
        isCounting = false;
        lastRenderedSec = -1;
        finalEl.style.display = 'none';
        
        // 触发大礼盒逻辑
        if (STATE.giftPhase === GIFT_PHASES.NONE) {
            toggleCountdown(false); // 收起右上角
            countdownTrigger.style.display = 'none'; // 彻底隐藏入口
            MegaGiftManager.spawn();
            audio.whistle();
        }
    };

    // 切换展开/收起
    const toggleCountdown = (forceState) => {
        countdownExpanded = forceState !== undefined ? forceState : !countdownExpanded;
        countdownTrigger.classList.toggle('expanded', countdownExpanded);
        countdownPanel.classList.toggle('show', countdownExpanded);
    };

    // 绑定事件
    countdownTrigger.onclick = (e) => {
        e.stopPropagation();
        toggleCountdown();
    };

    document.addEventListener('click', (e) => {
        if (countdownExpanded && !countdownPanel.contains(e.target) && !countdownTrigger.contains(e.target)) {
            toggleCountdown(false);
        }
    });
    
    // 面板点击收起
    countdownPanel.onclick = () => toggleCountdown(false);

    // 首次展示逻辑 (Auto Show)
    window.showCountdownFirstTime = () => {
        // 默认开始真实日期倒计时
        initCelebrationCountdown();
    };

    // 启动定时器
    countdownTimer = setInterval(updateCountdown, 200); // 提高刷新率以保证平滑
    
    // --- 🛠️ Debug / Test Helpers ---
    window.debugSetDate = (mode) => {
        // 重置状态
        isChristmasUIActive = false;
        STATE.christmasParty = false;
        deactivateChristmasMode(); 
        
        console.log(`🛠️ Debug Switching: ${mode}`);
        
        switch(mode) {
            case 'test-day': // 1天 0时 1分 5秒
                initCelebrationCountdown(24*3600 + 60 + 5); 
                console.log("-> Set to 1d 0h 1m 5s (Standard UI)");
                break;
            case 'test-10h': // 10时 0分 5秒 (Should be Standard UI)
                initCelebrationCountdown(10*3600 + 5); 
                console.log("-> Set to 10h 0m 5s (Standard UI)");
                break;
            case 'test-1h': // 1时 0分 5秒 (Should be Celebration Phase 1)
                initCelebrationCountdown(3600 + 5); 
                console.log("-> Set to 1h 0m 5s (Celebration Phase 1)");
                break;
            case 'test-1m': // 1分 5秒 (Should be Celebration Phase 2)
                initCelebrationCountdown(65); 
                console.log("-> Set to 1m 5s (Celebration Phase 2)");
                break;
            case 'test-15s': // 15秒 (Should be Celebration Phase 4)
                initCelebrationCountdown(15); 
                console.log("-> Set to 15s (Celebration Phase 4)");
                break;
            case 'reset':
            default:
                initCelebrationCountdown(null); // Real date
                console.log("-> Reset to Real Date");
                break;
        }
        
        // 立即刷新一次 UI
        updateCountdown();
    };
    
    console.log("🔧 Celebration Countdown Ready (Hybrid Mode).");
}

window.onresize = () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    
    // 检查性能模式开关
    const isLow = document.getElementById('chk-perf')?.checked;
    renderer.setPixelRatio(isLow ? 1.0 : Math.min(window.devicePixelRatio, 1.5));
    
    renderer.setSize(innerWidth, innerHeight); 
    composer.setSize(innerWidth, innerHeight);

    // 更新 FXAA 分辨率
    const pixelRatio = renderer.getPixelRatio();
    const fxaaPass = composer.passes.find(p => p.material && p.material.uniforms && p.material.uniforms.resolution);
    if(fxaaPass) {
        fxaaPass.material.uniforms['resolution'].value.x = 1 / (innerWidth * pixelRatio);
        fxaaPass.material.uniforms['resolution'].value.y = 1 / (innerHeight * pixelRatio);
    }
};

try {
    init();
} catch (e) {
    console.error("Critical Init Error:", e);
    alert("无法启动应用 (Init Error): " + e.message);
}
</script>
    </body>
</html>
